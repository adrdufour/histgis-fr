// ===========================================================================
// Infobulle
// ===========================================================================
svg.addEventListener("mousemove", ev => {
  const cible = ev.target.closest("[data-atome]");
  const t = $("#infobulle");
  if (!cible) { t.style.display = "none"; return; }
  const aid = cible.dataset.atome;
  const c = S.communes[aid];
  const d = detail(aid);
  let h = `<b>${d.noms.map(echappe).join(" / ")}</b>`;
  if (c.i) h += ` <span class="sec">${echappe(c.i)}</span>`;
  if (d.cantons.length === 1) h += `<br>canton : ${echappe(d.cantons[0].nom)}`;
  else if (d.cantons.length > 1)
    h += `<br>cantons : ${d.cantons.map(u => echappe(u.nom)).join(", ")}`;
  if (d.circos.length === 1) h += `<br>circonscription : ${echappe(d.circos[0].nom)}`;
  else if (d.circos.length > 1)
    h += `<br>circonscriptions : ${d.circos.map(u => echappe(u.nom)).join(", ")}`;
  if (ETIQ_TYPE[d.type])
    h += `<br><span class="sec">${ETIQ_TYPE[d.type]}</span>`;
  if (c.nm) h += `<br><span class="sec">nom renommé depuis — chronologie dans la fiche</span>`;
  t.innerHTML = h;
  const r = $("#carte-zone").getBoundingClientRect();
  t.style.left = Math.min(ev.clientX - r.left + 12, r.width - 275) + "px";
  t.style.top = (ev.clientY - r.top + 12) + "px";
  t.style.display = "block";
});
svg.addEventListener("mouseleave", () => { $("#infobulle").style.display = "none"; });

// Clic : épingle la commune dans le panneau. Un second clic la détache.
svg.addEventListener("click", ev => {
  if (tire && tire.bouge) return;          // fin d'un glisser, pas un clic
  const cible = ev.target.closest("[data-atome]");
  S.selection = (cible && cible.dataset.atome !== S.selection)
    ? cible.dataset.atome : null;
  panneau();
});

// ===========================================================================
// Panoramique et zoom
// ===========================================================================
let tire = null;
svg.addEventListener("mousedown", ev => {
  tire = { x: ev.clientX, y: ev.clientY, v: { ...S.vue }, bouge: false };
  svg.classList.add("tire");
});
window.addEventListener("mousemove", ev => {
  if (!tire || !S.vue) return;
  if (Math.abs(ev.clientX - tire.x) + Math.abs(ev.clientY - tire.y) > 3)
    tire.bouge = true;
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  S.vue.x = tire.v.x - (ev.clientX - tire.x) * vb.width / r.width;
  S.vue.y = tire.v.y - (ev.clientY - tire.y) * vb.height / r.height;
  applique();
});
window.addEventListener("mouseup", () => {
  setTimeout(() => { tire = null; }, 0);   // le clic est traité avant l'oubli
  svg.classList.remove("tire");
});
svg.addEventListener("wheel", ev => {
  if (!S.vue) return;
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const mx = vb.x + (ev.clientX - r.left) / r.width * vb.width;
  const my = vb.y + (ev.clientY - r.top) / r.height * vb.height;
  const f = ev.deltaY > 0 ? 1.18 : 1 / 1.18;
  S.vue = {
    x: mx - (mx - S.vue.x) * f, y: my - (my - S.vue.y) * f,
    w: S.vue.w * f, h: S.vue.h * f,
  };
  applique();
  // Les étiquettes de communes apparaissent une à une selon la taille de
  // chaque commune à l'écran : le zoom change donc la liste. On redessine une
  // fois la molette calmée plutôt qu'à chaque cran, qui coûterait plusieurs
  // centaines de chemins pour rien.
  if ($("#v-noms").value === "communes" || $("#v-noms").value === "tout") {
    clearTimeout(S.minuterieZoom);
    S.minuterieZoom = setTimeout(dessine, 140);
  }
}, { passive: false });
window.addEventListener("resize", applique);

// ===========================================================================
// Curseur, jauge de disponibilité
// ===========================================================================
// ---------------------------------------------------------------------------
// Le curseur ne va pas de 1815 à 2012 partout : il se borne au premier et au
// dernier millésime que la base sert pour le département affiché. Proposer
// 1950 pour la Meurthe, disparue en 1871, ou 1890 pour la Moselle, alors
// allemande, ce serait offrir de naviguer dans un territoire qui n'existe pas.
// Les bornes viennent des données ; les motifs, eux, sont déclarés.
// ---------------------------------------------------------------------------
function bornes() {
  if (!S.depIndex) return [AN_MIN, AN_MAX];
  // On préfère recalculer depuis les années servies plutôt que de faire
  // confiance au champ `bornes` : il n'existe que dans les exports récents, et
  // une page qui dépend d'un champ absent échoue en silence — c'est-à-dire de
  // la pire façon. Les clés d'`annees` sont là depuis toujours.
  if (!S._bornes) {
    const a = Object.keys(S.depIndex.annees).map(Number);
    // `existence` avant le repli global, et c'est ce qui empêche un
    // anachronisme de deux siècles. Un département dont la base ne sert AUCUNE
    // année — Mayotte, dont les communes existent mais dont aucun fichier ne
    // pose les rattachements — retombait sinon sur 1815-2012, le curseur de la
    // page entière. Le champ dit la période où le DÉPARTEMENT existe, ce qui
    // n'est pas la période où la base sait quelque chose de lui.
    const ex = S.depIndex.existence;
    S._bornes = a.length ? [Math.min(...a), Math.max(...a)]
              : (ex ? [ex[0], ex[1]] : [AN_MIN, AN_MAX]);
  }
  return S._bornes;
}

function absencePour(annee) {
  for (const [a, b, motif] of (S.depIndex && S.depIndex.absences) || [])
    if (annee >= a && annee <= b) return { a, b, motif };
  return null;
}

// L'absence d'OBJET ÉLECTORAL, distincte de l'absence de département.
//
// `absencePour` répond « pas de département à cette date » — la Moselle
// annexée, la Meurthe disparue. Ici le département existe : ce sont les
// circonscriptions qui n'existent pas, et pour toute la France. Sans cette
// distinction, la page dit « aucune source » là où la bonne réponse est
// « il n'y a pas eu d'élection », et le lecteur conclut à une lacune.
//
// À ne pas confondre non plus avec le trou 1941-1998 de la couche CANTONALE,
// qui est une vraie lacune de source. Celui-ci est plus court, et il est
// documenté plutôt que subi.
function absenceCirco(annee) {
  for (const [a, b, motif] of (S.index && S.index.absences_circo) || [])
    if (annee >= a && annee <= b) return { a, b, motif };
  return null;
}

// Année servie la plus proche, pour ne pas laisser le curseur en terrain vide.
function plusProcheServie(annee) {
  const an = S.depIndex.annees;
  if (an[String(annee)]) return annee;
  for (let d = 1; d <= AN_MAX - AN_MIN; d++) {
    if (an[String(annee - d)]) return annee - d;
    if (an[String(annee + d)]) return annee + d;
  }
  return annee;
}

function dessineJauge() {
  const j = $("#jauge"); j.innerHTML = "";
  if (!S.depIndex) return;
  const [a0, a1] = bornes();
  const n = a1 - a0 + 1;
  // Le centre du curseur pour l'année a est à (a - a0) / (a1 - a0) de la voie :
  // c'est cette échelle-là, et pas (a - a0) / n, qui fait tomber la graduation
  // de 1870 exactement sous le curseur posé sur 1870.
  const den = Math.max(1, a1 - a0);
  const pc = a => Math.max(0, Math.min(100, (a - a0) / den * 100));
  const pose = (d0, d1, cls) => {
    const d = document.createElement("div");
    d.className = cls;
    const g0 = pc(d0 - .5), g1 = pc(d1 + .5);
    d.style.left = g0 + "%";
    d.style.width = (g1 - g0) + "%";
    j.appendChild(d);
  };
  let cour = null, debut = a0;
  for (let a = a0; a <= a1 + 1; a++) {
    const e = S.depIndex.annees[String(a)];
    const cls = !e ? (absencePour(a) ? "j-abs" : null)
              : (e.c && e.x ? "j-both" : (e.c ? "j-can" : "j-cir"));
    if (cls !== cour) {
      if (cour) pose(debut, a - 1, cour);
      cour = cls; debut = a;
    }
  }
  // Graduation par décennies. Un tiret à chaque décennie, et l'étiquette
  // seulement si la place le permet : à 142 années sur 500 pixels, quinze
  // libellés de quatre chiffres se chevauchent. On étiquette donc une décennie
  // sur une, deux ou cinq selon la largeur réellement disponible — mesurée,
  // pas devinée.
  const g = $("#graduation"); g.innerHTML = "";
  const r = $("#reperes"); r.innerHTML = "";
  const largeur = g.getBoundingClientRect().width || 520;
  const pasEtiq = [10, 20, 50, 100].find(p => largeur / (n / p) >= 36) || 100;
  // Les bornes du département sont toujours nommées : ce sont elles qui disent
  // jusqu'où la base va. Elles occupent donc la place en premier, et une
  // décennie trop proche renonce à son libellé — c'est ce qui produisait le
  // « 18701870 » quand la borne tombait sur une décennie.
  const pris = [];
  // Un département servi sur une seule année — la Meurthe, 1870 — a ses deux
  // bornes confondues : un seul libellé, centré.
  const extremites = a0 === a1 ? [[a0, "borne"]]
                               : [[a0, "borne g"], [a1, "borne d"]];
  for (const [a, cls] of extremites) {
    const s = document.createElement("span");
    s.textContent = a; s.className = cls;
    s.style.left = pc(a) + "%";
    r.appendChild(s);
    pris.push(pc(a));
  }
  const libre = x => pris.every(p => Math.abs(p - x) * largeur / 100 >= 30);
  for (let a = Math.ceil(a0 / 10) * 10; a <= a1; a += 10) {
    const x = pc(a);
    const etiquette = a % pasEtiq === 0 && libre(x);
    const t = document.createElement("i");
    t.className = etiquette ? "haut" : "";
    t.style.left = x + "%";
    g.appendChild(t);
    if (etiquette) {
      const s = document.createElement("span");
      s.textContent = a;
      s.style.left = x + "%";
      r.appendChild(s);
      pris.push(x);
    }
  }
  const c = $("#curseur");
  c.min = a0; c.max = a1;
}

// ===========================================================================
// Orchestration
// ===========================================================================
async function majAnnee(annee, redessine = true) {
  S.annee = annee;
  $("#annee-aff").textContent = annee;
  $("#curseur").value = annee;
  // Une année qui ne se charge pas ne doit pas laisser à l'écran celle d'avant
  // sous le millésime de la nouvelle : la page le dit, en plein milieu.
  let ok;
  try {
    ok = await chargeAnnee(annee);
  } catch (err) {
    console.error(err);
    const ch = $("#chargement");
    ch.textContent = `${annee} n'a pas pu être chargée (${err.message}). ` +
      `La carte montre encore une autre année. Un export est peut-être en ` +
      `cours : recharger la page quand il sera fini.`;
    ch.style.display = "grid";
    lien();
    return;
  }
  if (ok) {
    $("#chargement").textContent = "chargement…";
    $("#chargement").style.display = "none";
    if (redessine) dessine();
  }
  lien();
}

async function majDep(dep) {
  await chargeDepartement(dep);
  S.selection = null;
  dessineJauge();
  const [a0, a1] = bornes();
  // On garde l'année en cours si le département la sert ; sinon on se pose sur
  // la plus proche qu'il serve, plutôt que d'ouvrir sur une carte vide.
  let a = Math.min(a1, Math.max(a0, S.annee));
  if (!S.depIndex.annees[String(a)]) a = plusProcheServie(a);
  await majAnnee(a);
  S.cadre = null; calibre();
  dessine();
  const m = S.depIndex.motifs || [];
  if (m[0] || m[1]) {
    const bouts = [];
    if (m[0]) bouts.push(`existe depuis ${a0} — ${m[0]}`);
    if (m[1]) bouts.push(`n'existe plus après ${a1} — ${m[1]}`);
    $("#entete-sous").textContent = bouts.join(" ; ");
  } else {
    $("#entete-sous").textContent =
      `base histgis — ${a0}-${a1} pour ce département, grille ` +
      `${S.index.grille_m} m, export du ${S.index.genere}`;
  }
}

function lien() {
  history.replaceState(null, "", `#${S.dep}/${S.annee}`);
}

$("#curseur").addEventListener("input", ev => {
  const a = +ev.target.value;
  S.annee = a; $("#annee-aff").textContent = a;
  const abs = absencePour(a);
  $("#annee-aff").style.color = (abs || !S.depIndex.annees[String(a)])
    ? "var(--gris)" : "";
});
$("#curseur").addEventListener("change", ev => majAnnee(+ev.target.value));
$("#dep").addEventListener("change", ev => majDep(ev.target.value));
["v-communes", "v-cantons", "v-circos", "v-noms", "teinte"]
  .forEach(id => $("#" + id).addEventListener("change", dessine));
$("#recadrer").addEventListener("click", () => { S.cadre = null; calibre(); });
window.addEventListener("keydown", ev => {
  if (ev.target.tagName === "SELECT" || ev.target.tagName === "INPUT") return;
  const [a0, a1] = bornes();
  if (ev.key === "ArrowLeft") majAnnee(Math.max(a0, S.annee - 1));
  if (ev.key === "ArrowRight") majAnnee(Math.min(a1, S.annee + 1));
});

let minuterie = null;
$("#lecture").addEventListener("click", () => {
  const b = $("#lecture");
  if (minuterie) {
    clearInterval(minuterie); minuterie = null;
    b.classList.remove("actif"); b.textContent = "▶ animer";
    return;
  }
  b.classList.add("actif"); b.textContent = "■ arrêter";
  minuterie = setInterval(() => {
    const [a0, a1] = bornes();
    majAnnee(S.annee >= a1 ? a0 : S.annee + 1);
  }, 320);
});

(async function demarre() {
  S.index = await charge(`${RACINE}/index.json`);
  const sel = $("#dep");
  // Deux groupes, parce que ce sont deux ESPACES de la base et non deux
  // régions d'un même. La métropole vient de `unit`/`membership` en
  // Lambert-93 ; l'outre-mer de `om_*` en WGS84, avec sa propre trame et sa
  // propre couverture. Les mêler dans une liste plate ferait attendre du 971
  // ce que le 01 sait faire — une profondeur de 1870 à 2012 — alors que
  // l'outre-mer ne commence qu'en 1946 et n'a pas de géométrie datée.
  //
  // Le code à trois caractères est le repère, et c'est un fait de la source :
  // `om_unit.dep` est `char(3)` là où `unit.dep` est `char(2)`, précisément
  // parce que les deux ne tiennent pas dans la même colonne.
  const groupes = new Map();
  const groupeDe = code => code.length > 2 ? "Outre-mer" : "Métropole";
  for (const d of S.index.departements) {
    const titre = groupeDe(d.code);
    if (!groupes.has(titre)) {
      const g = document.createElement("optgroup");
      g.label = titre;
      groupes.set(titre, g);
    }
    const o = document.createElement("option");
    o.value = d.code;
    // Pas de plage d'années dans le libellé : elle allongeait chaque ligne et
    // rendait la liste moins lisible pour une information que le curseur donne
    // déjà. Elle est rappelée en tête de page une fois le département choisi.
    o.textContent = `${d.code} — ${d.nom}`;
    groupes.get(titre).appendChild(o);
  }
  // Métropole d'abord, quel que soit l'ordre des codes : `971` se range avant
  // `99` dans un tri de chaînes, et l'outre-mer se serait glissé au milieu de
  // la métropole sans que le libellé de groupe ait de sens.
  for (const titre of ["Métropole", "Outre-mer"])
    if (groupes.has(titre)) sel.appendChild(groupes.get(titre));
  $("#entete-sous").textContent =
    `base histgis — ${S.index.departements.length} départements, ` +
    `grille ${S.index.grille_m} m, export du ${S.index.genere}`;

  // `{2,3}` et non `{2}` : les départements d'outre-mer ont un code INSEE à
  // trois caractères (971 à 976). Avec `{2}`, un lien partagé vers
  // `#974/1990` ne correspondait à rien, la page retombait silencieusement sur
  // le premier département de la liste, et l'utilisateur croyait au lien mort
  // alors que la Réunion était bien exportée. La vérification d'appartenance à
  // la ligne suivante reste la vraie garde ; ce motif ne fait que ne plus
  // exclure d'avance.
  const m = location.hash.match(/^#([0-9AB]{2,3})\/(\d{4})$/);
  const dep = (m && S.index.departements.some(d => d.code === m[1])) ? m[1]
            : S.index.departements[0].code;
  S.annee = m ? Math.min(AN_MAX, Math.max(AN_MIN, +m[2])) : 1870;
  sel.value = dep;
  await majDep(dep);
})().catch(e => {
  document.body.innerHTML =
    `<div style="padding:40px;font:15px/1.6 Georgia,serif">
       <h2>Les données ne sont pas là</h2>
       <p><code>${echappe(e.message)}</code></p>
       <p>Il faut d'abord exporter la base, puis servir la page :</p>
       <pre style="background:#efece5;padding:12px;border-radius:3px">python3 cartes/export_web.py
python3 cartes/web/servir.py</pre>
       <p style="color:#6b6864">Ouvrir <code>index.html</code> directement depuis
       le disque ne peut pas marcher : les navigateurs refusent <code>fetch()</code>
       sur <code>file://</code>.</p>
     </div>`;
});
</script>
<script>
"use strict";
// ===========================================================================
// Export vers Wikimedia Commons
//
// Deux images, toutes deux tirées de ce que la page a DÉJÀ chargé pour
// l'année affichée — aucune requête à la base, aucune géométrie recalculée :
//
//   * la carte du département : ses circonscriptions coloriées et numérotées,
//     limites cantonales et communales en trait fin ;
//   * la carte de situation d'UNE circonscription : le département en grisé,
//     la circonscription en rouge — le format des cartes de localisation des
//     articles de Wikipédia.
//
// Le dépôt suit parliamentdiagram (github.com/slashme/parliamentdiagram) :
// la page fabrique le SVG et le wikitexte `{{Information}}`, `servir.py`
// détient le jeton et parle à l'API (voir `commons.py`). Description, licence
// et catégories sont pré-remplies et restent modifiables avant l'envoi ; les
// catégories sont vérifiées en direct sur Commons, parce qu'une catégorie
// devinée qui n'existe pas range le fichier nulle part — en silence.
// ===========================================================================

// ---------------------------------------------------------------------------
// Réglages éditoriaux : c'est ICI qu'on corrige une catégorie ou une source,
// pas dans le code qui suit.
// ---------------------------------------------------------------------------
const COMMONS = {
  licence: "{{self|cc-by-sa-4.0}}",
  largeurMax: 1100,               // côté le plus long de l'image, en pixels
  // Catégories par défaut. `{dep}` : nom ACTUEL du département (c'est sous
  // lui que Commons range les cartes, même historiques) ; `{periode}` : la
  // catégorie du régime, ci-dessous.
  categories: {
    departement: ["Maps of legislative constituencies of France",
                  "Maps of the history of {dep}", "{periode}"],
    circo: ["Locator maps of legislative constituencies of France",
            "Maps of the history of {dep}", "{periode}"],
    cantons: ["Maps of cantons of France", "Maps of the history of {dep}", "{periode}"],
    cantonSituation: ["Locator maps of cantons of France",
                      "Maps of the history of {dep}", "{periode}"],
  },
  periodes: [            // [première année, dernière, catégorie, chambre fr, chambre en]
    [1814, 1830, "Maps of the Bourbon Restoration",
     "Chambre des députés des départements", "Chamber of Deputies"],
    [1830, 1848, "Maps of the July Monarchy",
     "Chambre des députés", "Chamber of Deputies"],
    [1848, 1851, "Maps of the French Second Republic",
     "Assemblée nationale", "National Assembly"],
    [1852, 1870, "Maps of the Second French Empire",
     "Corps législatif", "Corps législatif"],
    [1871, 1940, "Maps of the French Third Republic",
     "Chambre des députés", "Chamber of Deputies"],
    [1945, 1958, "Maps of the French Fourth Republic",
     "Assemblée nationale", "National Assembly"],
    [1958, 2100, "Maps of the French Fifth Republic",
     "Assemblée nationale", "National Assembly"],
  ],
  // Source de la COMPOSITION électorale, par période. Le fond communal est
  // ajouté à part (ANR-COMMUNES, GEOFLA en repli).
  sources: [
    [1815, 1869, "Bernard Gaudillère, ''Atlas historique des circonscriptions " +
                 "électorales françaises'', Genève, Droz, 1995"],
    [1870, 1940, "TRF-GIS (V. Gay), Harvard Dataverse, CC BY 4.0"],
    [1986, 2012, "Ministère de l'Intérieur, tableaux de correspondance " +
                 "communes-cantons-circonscriptions (Licence Ouverte)"],
  ],
  // Source de la COMPOSITION cantonale, par période.
  sourcesCantons: [
    [1870, 1940, "TRF-GIS (V. Gay), Harvard Dataverse, CC BY 4.0"],
    [1941, 1998, "base ''histgis'' : registre des mouvements cantonaux (décrets, " +
                 "''Journal officiel''), recensements de 1954 et 1968"],
    [1999, 2012, "Insee, Code officiel géographique (Licence Ouverte)"],
  ],
  // Paragraphe pour Wikipédia : le suffixe que portent les titres des articles
  // de circonscription hors Ve République (« Première circonscription de la
  // Seine (Quatrième République) »), selon la première année du découpage.
  // Seul celui de la IVe est attesté ; les autres sont des paris, que la
  // vérification des liens tranche.
  regimesWiki: [
    [1814, 1830, "Restauration"], [1831, 1848, "Monarchie de Juillet"],
    [1849, 1851, "Deuxième République"], [1852, 1870, "Second Empire"],
    [1871, 1940, "Troisième République"], [1945, 1957, "Quatrième République"],
    [1958, 2100, ""],
  ],
  // Élections législatives générales, pour dire lesquelles un découpage a servi.
  elections: [1815, 1816, 1820, 1824, 1827, 1830, 1831, 1834, 1837, 1839, 1842,
              1846, 1848, 1849, 1852, 1857, 1863, 1869, 1871, 1876, 1877, 1881,
              1885, 1889, 1893, 1898, 1902, 1906, 1910, 1914, 1919, 1924, 1928,
              1932, 1936, 1945, 1946, 1951, 1956, 1958, 1962, 1967, 1968, 1973,
              1978, 1981, 1986, 1988, 1993, 1997, 2002, 2007, 2012],
  // Douze teintes douces et distinctes pour la carte départementale.
  palette: ["#e9c79c", "#b5d2ac", "#c6c0e2", "#f2d98b", "#a7cbe4", "#e5b5b4",
            "#d0e2a4", "#d9c0a2", "#b3dcd3", "#efc4dc", "#d6d3a6", "#c2d6f0"],
  rouge: "#c12838", rougeTrait: "#7a1020",
  // Carte d'une liste de communes : la nature de l'ensemble donne le libellé
  // de la description et ses catégories propres ; `parDep` s'ajoute pour
  // chaque département touché. Des propositions, vérifiées en direct.
  natures: {
    aop: { fr: "appellation d'origine", en: "protected designation of origin",
           categories: ["Maps of appellations d'origine contrôlée"] },
    epci: { fr: "intercommunalité", en: "intercommunal structure",
            categories: ["Locator maps of intercommunalities of France"] },
    autre: { fr: "ensemble de communes", en: "group of municipalities",
             categories: ["Locator maps of communes of France"] },
  },
  categoriesListe: { parDep: ["Maps of {dep}"] },
};

// ---------------------------------------------------------------------------
// Petits outils de langue
// ---------------------------------------------------------------------------
// « de l'Ain », « de la Côte-d'Or », « du Nord », « des Bouches-du-Rhône »,
// « de Saône-et-Loire ». Une description qui écrit « du département de
// Côte-d'Or » se lit comme une traduction automatique ; mieux vaut une table.
const DEP_MASC = new Set(["Nord", "Rhône", "Gard", "Gers", "Lot", "Jura",
  "Cantal", "Calvados", "Var", "Tarn", "Doubs", "Cher", "Loiret", "Finistère",
  "Morbihan", "Pas-de-Calais", "Puy-de-Dôme", "Haut-Rhin", "Bas-Rhin",
  "Vaucluse", "Val-de-Marne", "Val-d'Oise", "Territoire de Belfort",
  "Loir-et-Cher", "Haut-Rhin"]);
const DEP_PLUR = /^(Bouches|Basses|Hautes|Côtes|Deux|Pyrénées|Alpes|Ardennes|Landes|Vosges|Yvelines|Hauts)\b/;
function deDep(nom) {
  if (DEP_PLUR.test(nom)) return "des " + nom;
  if (DEP_MASC.has(nom)) return "du " + nom;
  const voyelle = /^[AEIOUYÉÈH]/.test(nom) && !/^Haute?-/.test(nom);
  if (/-et-/.test(nom) || nom === "Paris" || nom === "Mayotte")
    return (voyelle ? "d'" : "de ") + nom;
  if (voyelle) return "de l'" + nom;
  return "de la " + nom;
}
const xmlEsc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nomFichierPropre = s => s.replace(/[#<>\[\]|{}\/:\\]+/g, "-")
  .replace(/\s+/g, " ").trim();

function periodeDe(annee) {
  return COMMONS.periodes.find(([a, b]) => annee >= a && annee <= b) || null;
}
function sourceDe(annee) {
  const s = COMMONS.sources.find(([a, b]) => annee >= a && annee <= b);
  return s ? s[2] : "base ''histgis''";
}
function nomModerne(dep) {
  return dep.noms && dep.noms.length ? dep.noms[dep.noms.length - 1][2] : dep.nom;
}
// Les noms en base portent quelques scories qu'il ne faut pas reporter sur
// Commons : « 01e circonscription n° 02 » (après 1958, le code du département
// pris pour un ordinal), « Paris 1e » pour « 1re », « Chalon (sur-Saône-1-
// sur-Saône-2) » pour une ville partagée non découpée, « Lisieux () ».
const ordinal = n => (+n === 1 ? "1re" : `${+n}e`);
function nomCommons(u) {
  const s = SECTEURS_SEINE[u.id];
  if (s) return `${s[0] < 4 ? "Paris" : "Seine"} ${ordinal(s[0])} circonscription (${s[1].toLowerCase()})`;
  let n = String(u.nom || u.code || "");
  let m = /^[0-9AB]+e circonscription n° 0*(\d+)$/.exec(n);
  if (m) {
    const dep = S.index.departements.find(d => d.code === S.dep) || {};
    return `${nomDep(dep, S.annee)} ${ordinal(m[1])} circonscription`;
  }
  m = /^Paris (\d+)\/(\d+)e circonscription$/.exec(n);
  if (m) return `Paris ${+m[2] === 1 ? "1er" : m[2] + "e"} arrondissement, ${ordinal(m[1])} circonscription`;
  n = n.replace(/\b1e (circonscription)/, "1re $1");
  m = /^(.+?) \(([^()]*)\)$/.exec(n);
  if (m && /\d/.test(m[2]) && !/circonscription/.test(m[1])) {
    // ville partagée : « Chalon (sur-Saône-1-sur-Saône-2) »
    const t = m[2].split("-"), i = t.findIndex(x => /^\d+$/.test(x));
    const ville = i > 0 ? `${m[1]}-${t.slice(0, i).join("-")}` : m[1];
    const nums = t.filter(x => /^\d+$/.test(x));
    const suite = nums.length > 2 && nums.every((x, k) => k === 0 || +x === +nums[k - 1] + 1);
    const liste = suite ? `${ordinal(nums[0])} à ${ordinal(nums[nums.length - 1])}`
      : nums.slice(0, -1).map(ordinal).join(", ") + " et " + ordinal(nums[nums.length - 1]);
    return `${ville} (${liste} circonscriptions, non séparées)`;
  }
  return n.replace(/ \(\)$/, "");
}

// Le libellé court posé sur la carte : « 1 » pour `21-01`, le nom quand la
// circonscription en a un (« Belley », « Bourg-1 » pour `0101`, `0102` en
// 1876-1936 ; « Beaune » pour un collège d'arrondissement), rien pour un
// scrutin de liste.
//  - Un code à suffixe littéral (`75-nord`, `75-sud`, `75-tout` : la
//    banlieue de la Seine) ne dit rien du numéro : on le prend dans le nom
//    (« Seine 13e circonscription — Sceaux » → 13 ; « collège de
//    Saint-Denis » → Saint-Denis).
//  - Les codes TRF-GIS 80 et au-delà (`0380`) ne sont pas des numéros : c'est
//    une ville partagée entre circonscriptions et laissée entière. On pose les
//    numéros des circonscriptions qu'elle mêle (« 3-4 »), ou rien.
//  - Au scrutin de liste, rien quand le département forme une seule
//    circonscription ; quand il en forme plusieurs (1919-1928 : Seine,
//    Aveyron, Calvados…), leur numéro, le `L` du code ôté (`L7504` → 4).
function etiquetteCourte(u) {
  if (SECTEURS_SEINE[u.id]) return String(SECTEURS_SEINE[u.id][0]);
  let c = String(u.code || "");
  if (u.regime === "liste" || /^L/.test(c)) {
    if (!S.cfgCirco || S.cfgCirco.unites.filter(w => w.g).length < 2) return "";
    c = c.replace(/^L/, "");
  }
  const tiret = c.includes("-");
  const reste = tiret ? c.slice(c.indexOf("-") + 1)
              : (c.startsWith(S.dep) ? c.slice(S.dep.length) : c);
  if (/^\d+$/.test(reste)) {
    if (tiret) return String(+reste);
    // Code TRF-GIS : quand la circonscription a un nom (« Belley »,
    // « Bourg-1 », 1876-1936), c'est lui qu'on pose, pas le rang du code.
    const nom = String(u.nom || "");
    const nomme = u.regime !== "liste" && nom && !/circonscription/.test(nom);
    if (+reste < 80) return nomme ? nom : String(+reste);
    const m = /^(.+?) \(([^()]*)\)$/.exec(nom);
    if (!m) return "";
    const t = m[2].split("-"), i = t.findIndex(x => /^\d+$/.test(x));
    const ville = i > 0 ? `${m[1]}-${t.slice(0, i).join("-")}` : m[1];
    const ks = t.filter(x => /^\d+$/.test(x));
    // ville laissée entière : son nom, la description dit lesquelles elle mêle
    if (nomme) return ks.length ? ville : "";
    const nums = ks.map(k => {
      const v = S.cfgCirco.unites.find(w => w.nom === `${ville}-${k}`);
      return v ? etiquetteCourte(v) : null;
    });
    return nums.length && nums.every(x => x && /^\d+$/.test(x)) ? nums.join("-") : "";
  }
  if (/^\d+\/\d+$/.test(reste)) return reste;   // Paris 1881 : 1re du 10e arr.
  const nom = String(u.nom || "");
  let m = /(\d+)(?:re|er|e|ème) circonscription/.exec(nom);
  if (m) return String(+m[1]);
  m = /collège (?:de |d'|du |des )(.+)$/.exec(nom);
  if (m && m[1] !== "département") return m[1];
  return reste;
}

// La Seine de 1919-1928 : quatre circonscriptions au scrutin de liste, trois
// secteurs de Paris et la banlieue. La base les tient sous deux séries de
// codes (`75-1` à `75-3` pour Paris, `L7504` « Seine-4 » pour la banlieue) ;
// on leur rend leur numéro et leur nom d'usage.
//   1 Nord : 8e, 9e, 10e, 17e, 18e, 19e arrondissements
//   2 Est : 1er à 4e, 11e, 12e, 20e
//   3 Sud : 5e, 6e, 7e, 13e à 16e
const SECTEURS_SEINE = {
  "Q1919_1928#1": [1, "Nord"], "Q1919_1928#2": [2, "Est"],
  "Q1919_1928#3": [3, "Sud"], "L7504@1919": [4, "Banlieue"],
};
// L'étiquette posée sur l'image : le numéro seul, secteurs compris — le nom
// du secteur reste dans la description.
const etiquetteCarte = etiquetteCourte;

// ---------------------------------------------------------------------------
// Période de validité du découpage affiché
//
// Les fichiers `x_<sig>.json` sont signés sur leur CONTENU, géométrie
// comprise : deux années du même découpage peuvent porter deux signatures si
// ANR-COMMUNES édite un polygone entre-temps (la Côte-d'Or a deux fichiers
// pour le découpage de 1831). Comparer les signatures couperait une
// législature en deux. On compare donc les identifiants d'unités, qui portent
// l'année de leur version (`21-01@1852`) et ne changent qu'avec le découpage.
// ---------------------------------------------------------------------------
async function plageDecoupage() {
  const ids = S.cfgCirco.unites.map(u => u.id).sort().join("|");
  const an = S.depIndex.annees;
  const [b0, b1] = bornes();
  const memes = async a => {
    const e = an[String(a)];
    if (!e || !e.x) return false;
    const x = await charge(`${RACINE}/dep/${S.dep}/x_${e.x}.json`);
    return x.unites.map(u => u.id).sort().join("|") === ids;
  };
  let a0 = S.annee, a1 = S.annee;
  while (a0 - 1 >= b0 && await memes(a0 - 1)) a0--;
  while (a1 + 1 <= b1 && await memes(a1 + 1)) a1++;
  return { a0, a1, ouvertDebut: a0 === b0, ouvertFin: a1 === b1 };
}

// ---------------------------------------------------------------------------
// Géométrie : projection propre à l'image, en pixels
// ---------------------------------------------------------------------------
function polygonesDe(g, out = []) {
  if (!g) return out;
  if (g.type === "Polygon") out.push(g.coordinates);
  else if (g.type === "MultiPolygon") g.coordinates.forEach(p => out.push(p));
  else if (g.type === "GeometryCollection") g.geometries.forEach(x => polygonesDe(x, out));
  return out;
}

function fabriqueProjection(geoms, largeur = COMMONS.largeurMax, marge = 12) {
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  geoms.forEach(g => bboxDe(g, b));
  const pj = faitProjection(b);   // la même que la page : rien ne bouge
  const p0 = pj(b[0], b[3]), p1 = pj(b[2], b[1]);
  const lx = p1[0] - p0[0], ly = p1[1] - p0[1];
  const s = (largeur - 2 * marge) / Math.max(lx, ly);
  const W = Math.round(lx * s + 2 * marge), H = Math.round(ly * s + 2 * marge);
  const px = (lon, lat) => {
    const q = pj(lon, lat);
    return [(q[0] - p0[0]) * s + marge, (q[1] - p0[1]) * s + marge];
  };
  return { px, W, H };
}

function cheminPx(g, P) {
  const out = [];
  for (const poly of polygonesDe(g)) {
    for (const r of poly) {
      if (r.length < 3) continue;
      // Demi-pixel : deux communes voisines arrondissent leur limite commune
      // au même point, donc la partagent encore. Puis on retire les sommets
      // ALIGNÉS sur leurs voisins (allers-retours compris) : le tracé reste
      // exactement le même — un point retiré d'un côté de la limite et gardé
      // de l'autre est sur le segment, il n'ouvre aucune lisière. C'est ce
      // qui divise le poids : la grille de 25 m multiplie les sommets qui se
      // confondent à cette échelle.
      const pts = [];
      for (const c of r) {
        const q = P.px(c[0], c[1]);
        const x = Math.round(q[0] * 2) / 2, y = Math.round(q[1] * 2) / 2;
        const d = pts[pts.length - 1];
        if (d && d[0] === x && d[1] === y) continue;
        pts.push([x, y]);
        while (pts.length >= 3) {
          const [a, b, c2] = pts.slice(-3);
          if ((b[0] - a[0]) * (c2[1] - a[1]) - (b[1] - a[1]) * (c2[0] - a[0]) !== 0) break;
          pts.splice(pts.length - 2, 1);
          const n = pts.length;
          if (n >= 2 && pts[n - 1][0] === pts[n - 2][0] && pts[n - 1][1] === pts[n - 2][1]) pts.pop();
        }
      }
      if (pts.length > 1 && pts[0][0] === pts[pts.length - 1][0] &&
          pts[0][1] === pts[pts.length - 1][1]) pts.pop();
      if (pts.length < 3) continue;
      // Coordonnées relatives : exactes, puisque tout est en demi-pixels.
      out.push("M" + pts[0][0] + " " + pts[0][1]);
      for (let i = 1; i < pts.length; i++)
        out.push("l" + (pts[i][0] - pts[i - 1][0]) + " " + (pts[i][1] - pts[i - 1][1]));
      out.push("z");
    }
  }
  return out.join("");
}

// Point d'étiquette : le point intérieur le plus éloigné des bords du plus
// grand polygone (recherche sur grille, affinée deux fois). Le centroïde de
// la page tombe hors des circonscriptions en croissant — et un numéro posé
// chez le voisin est pire que pas de numéro.
function poleInterieur(g, P) {
  let meilleur = null, aire = -1;
  for (const poly of polygonesDe(g)) {
    const anneaux = poly.map(r => r.map(c => P.px(c[0], c[1])));
    const ext = anneaux[0];
    let a = 0;
    for (let i = 0, n = ext.length - 1; i < n; i++)
      a += ext[i][0] * ext[i + 1][1] - ext[i + 1][0] * ext[i][1];
    if (Math.abs(a) > aire) { aire = Math.abs(a); meilleur = anneaux; }
  }
  if (!meilleur) return null;
  const dedans = (x, y) => {
    let c = false;
    for (const r of meilleur)
      for (let i = 0, j = r.length - 1; i < r.length; j = i++)
        if ((r[i][1] > y) !== (r[j][1] > y) &&
            x < (r[j][0] - r[i][0]) * (y - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0])
          c = !c;
    return c;
  };
  const dist = (x, y) => {
    let d = Infinity;
    for (const r of meilleur)
      for (let i = 0; i < r.length - 1; i++) {
        const [ax, ay] = r[i], [bx, by] = r[i + 1];
        const dx = bx - ax, dy = by - ay;
        const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) /
                                          (dx * dx + dy * dy || 1)));
        d = Math.min(d, Math.hypot(x - ax - t * dx, y - ay - t * dy));
      }
    return d;
  };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  meilleur[0].forEach(([x, y]) => {
    x0 = Math.min(x0, x); y0 = Math.min(y0, y);
    x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  });
  let best = null, bestD = -1;
  let cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, lx = x1 - x0, ly = y1 - y0;
  for (let passe = 0; passe < 3; passe++) {
    const n = 18;
    for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) {
      const x = cx - lx / 2 + lx * i / n, y = cy - ly / 2 + ly * j / n;
      if (!dedans(x, y)) continue;
      const d = dist(x, y);
      if (d > bestD) { bestD = d; best = [x, y]; }
    }
    if (!best) break;
    [cx, cy] = best; lx /= 6; ly /= 6;
  }
  if (best) best.d = bestD;        // rayon libre : la taille d'un nom en dépend
  return best;
}

// Coloriage glouton : deux circonscriptions dont les emprises se touchent ne
// reçoivent pas la même teinte. L'emprise est un voisinage grossier, mais
// avec douze teintes pour rarement plus de dix unités, il suffit.
function teintesCircos(unites) {
  const bb = unites.map(u => bboxDe(u.g));
  const touche = (a, b) => !(a[2] < b[0] || b[2] < a[0] || a[3] < b[1] || b[3] < a[1]);
  const t = [];
  unites.forEach((u, i) => {
    const pris = new Set();
    for (let j = 0; j < i; j++) if (touche(bb[i], bb[j])) pris.add(t[j]);
    let k = 0;
    while (pris.has(k % COMMONS.palette.length) && k < COMMONS.palette.length) k++;
    t.push(k % COMMONS.palette.length);
  });
  return unites.map((u, i) => COMMONS.palette[t[i]]);
}

// ---------------------------------------------------------------------------
// Fabrication du SVG
//
// Deux niveaux depuis le 6 octobre 2026 : les circonscriptions (numérotées)
// ou les cantons (nommés). L'autre couche se superpose en trait : les cantons
// en trait fin sous les circonscriptions, les circonscriptions en trait épais
// sur les cantons.
// ---------------------------------------------------------------------------
function unitesDe(niveau) {
  const k = niveau === "canton" ? S.cfgCanton : S.cfgCirco;
  if (!k) return [];
  return [...k.unites].filter(u => u.g).sort(niveau === "canton"
    ? (a, b) => nomTriCanton(a).localeCompare(nomTriCanton(b), "fr", { numeric: true })
    : (a, b) => String(a.code).localeCompare(String(b.code), "fr", { numeric: true }));
}
// Paris d'abord, dans l'ordre des arrondissements, puis la banlieue.
const nomTriCanton = u => cantonParis(u) ? " " + String(cantonParis(u)).padStart(2, "0")
                                          : String(u.nom || "");

// Coloriage des cantons. L'emprise, qui suffit pour une dizaine de
// circonscriptions, ne suffit plus pour quarante cantons : presque toutes les
// emprises se chevauchent et douze teintes s'épuisent. On prend donc le vrai
// voisinage — deux unités qui partagent au moins deux sommets, ce qui est sûr
// puisque l'export pose toutes les formes sur la même grille — et on colorie
// en DSATUR (la plus contrainte d'abord). Repli sur l'emprise si aucune
// géométrie ne se touche.
function teintesVoisines(unites) {
  const sommets = new Map();
  unites.forEach((u, i) => {
    for (const poly of polygonesDe(u.g)) for (const r of poly) for (const c of r) {
      const k = c[0] + "," + c[1];
      let s = sommets.get(k);
      if (!s) sommets.set(k, s = new Set());
      s.add(i);
    }
  });
  const compte = unites.map(() => new Map());
  for (const s of sommets.values()) {
    if (s.size < 2) continue;
    for (const a of s) for (const b of s)
      if (a !== b) compte[a].set(b, (compte[a].get(b) || 0) + 1);
  }
  const adj = compte.map(m => [...m].filter(([, n]) => n >= 2).map(([j]) => j));
  if (adj.every(a => !a.length)) return teintesCircos(unites);
  const n = unites.length, N = COMMONS.palette.length, t = new Array(n).fill(-1);
  for (let pas = 0; pas < n; pas++) {
    let m = -1, ms = -1, md = -1;
    for (let i = 0; i < n; i++) {
      if (t[i] >= 0) continue;
      const sat = new Set(adj[i].map(j => t[j]).filter(x => x >= 0)).size;
      if (sat > ms || (sat === ms && adj[i].length > md)) { m = i; ms = sat; md = adj[i].length; }
    }
    const pris = new Set(adj[m].map(j => t[j]));
    let k = 0;
    while (pris.has(k) && k < N) k++;
    t[m] = k % N;
  }
  return t.map(k => COMMONS.palette[k]);
}

// Le nom posé sur un canton : « 5e » pour l'arrondissement de Paris qui fait
// canton, le nom du canton sinon.
function etiquetteCanton(u) {
  const n = cantonParis(u);
  if (n) return n === 1 ? "1er" : n + "e";
  return String(u.nom || "");
}
// Taille et coupure d'une étiquette : le plus grand corps qui tienne dans le
// disque libre autour du point d'étiquette (`d`, en pixels), sans dépasser
// `max`, sur une ligne, ou sur deux en coupant à un tiret ou une espace près
// du milieu quand l'étiquette y gagne nettement. Les numéros des
// circonscriptions de Paris (« 1/20 ») passent aussi par là : à 28 px fixes,
// ils débordaient de leur demi-arrondissement et se chevauchaient.
function miseEnLignes(t, d, { max = 15, min = 7, coupe = 9 } = {}) {
  d = d || 10;
  const corps = lignes => Math.min(max,
    (1.9 * d) / (0.58 * Math.max(...lignes.map(s => s.length))),
    (1.6 * d) / (1.15 * lignes.length));
  let lignes = [t], f = corps(lignes);
  if (t.length > coupe) {
    const coupes = [...t.matchAll(/[- ]/g)].map(m => m.index);
    if (coupes.length) {
      const i = coupes.reduce((a, b) =>
        Math.abs(b - t.length / 2) < Math.abs(a - t.length / 2) ? b : a);
      const deux = [t.slice(0, t[i] === "-" ? i + 1 : i), t.slice(i + 1)];
      const f2 = corps(deux);
      if (f2 > f * 1.15) { lignes = deux; f = f2; }
    }
  }
  return { lignes, taille: Math.max(min, Math.round(f * 2) / 2) };
}

function fabriqueSVG(o) {
  const canton = o.niveau === "canton";
  const kx = S.cfgCirco, kc = S.cfgCanton, kp = canton ? kc : kx;
  const unites = unitesDe(o.niveau);
  const P = fabriqueProjection(unites.map(u => u.g));
  const cible = o.type === "situation" ? unites.find(u => u.id === o.unite) : null;
  const L = [];
  L.push(`<?xml version="1.0" encoding="UTF-8"?>`);
  L.push(`<svg xmlns="http://www.w3.org/2000/svg" version="1.1" ` +
         `width="${P.W}" height="${P.H}" viewBox="0 0 ${P.W} ${P.H}">`);
  L.push(`<title>${xmlEsc(o.titre)}</title>`);
  L.push(`<desc>${xmlEsc(o.desc)}</desc>`);

  // 1. aplats
  const teintes = canton ? teintesVoisines(unites) : teintesCircos(unites);
  L.push(`<g id="${canton ? "cantons-aplats" : "circonscriptions"}" stroke="none" fill-rule="evenodd">`);
  unites.forEach((u, i) => {
    const f = cible ? (u === cible ? COMMONS.rouge : "#f1ede4") : teintes[i];
    L.push(`<path id="${xmlEsc(canton ? "k-" + u.id : "c-" + u.code)}" fill="${f}" d="${cheminPx(u.g, P)}"/>`);
  });
  L.push(`</g>`);

  // 2. limites communales — chaque polygone une fois, quel que soit le nombre
  //    d'atomes qui le revendiquent (même règle que la carte)
  if (o.communes) {
    const vus = new Set(), d = [];
    for (const aid of Object.keys(kp.rattachement)) {
      const vg = versionA(S.communes[aid], S.annee);
      if (!vg || vus.has(vg.g)) continue;
      vus.add(vg.g);
      d.push(cheminPx(vg.g, P));
    }
    L.push(`<path id="communes" fill="none" stroke="#ffffff" stroke-opacity="${cible ? .55 : .85}" ` +
           `stroke-width="0.5" stroke-linejoin="round" d="${d.join("")}"/>`);
  }
  // 3. sous les circonscriptions, les limites cantonales quand la base en
  //    tient à cette date
  if (!canton && o.autre && kc) {
    const d = kc.unites.filter(u => u.g).map(u => cheminPx(u.g, P));
    L.push(`<path id="cantons" fill="none" stroke="#5d574f" stroke-opacity=".75" ` +
           `stroke-width="0.9" stroke-linejoin="round" d="${d.join("")}"/>`);
  }
  // 4. limites de la couche principale, puis la cible par-dessus
  L.push(`<g id="limites" fill="none" stroke-linejoin="round" stroke-linecap="round">`);
  unites.forEach(u => {
    if (u === cible) return;
    L.push(`<path stroke="${cible ? "#8f897f" : "#2b2722"}" ` +
           `stroke-width="${cible || canton ? 1.1 : 1.8}" d="${cheminPx(u.g, P)}"/>`);
  });
  if (cible)
    L.push(`<path stroke="${COMMONS.rougeTrait}" stroke-width="1.8" d="${cheminPx(cible.g, P)}"/>`);
  L.push(`</g>`);
  // 5. sur les cantons, les circonscriptions en trait épais
  if (canton && o.autre && kx) {
    const d = kx.unites.filter(u => u.g).map(u => cheminPx(u.g, P));
    L.push(`<path id="circonscriptions" fill="none" stroke="#1d1c1a" ` +
           `stroke-opacity="${cible ? .55 : .9}" stroke-width="${cible ? 1.6 : 3.4}" ` +
           `stroke-linejoin="round" stroke-linecap="round" d="${d.join("")}"/>`);
  }

  // 6. numéros ou noms. Le liseré est un second <text> dessous, et non
  //    `paint-order` : tous les moteurs de rendu ne le lisent pas, et un
  //    numéro sans liseré disparaît sur une limite communale.
  if (o.numeros) {
    const lis = [], txt = [];
    for (const u of unites) {
      const t = canton ? etiquetteCanton(u) : etiquetteCarte(u);
      if (!t) continue;
      const p = poleInterieur(u.g, P);
      if (!p) continue;
      const sur = u === cible;
      const { taille, lignes } = canton ? miseEnLignes(t, p.d)
        : miseEnLignes(t, p.d, { min: 9, coupe: 5,
            max: /^\d+$/.test(t) ? 34 : /^[\d\/-]+$/.test(t) ? 28
               : (t.length > 12 ? 19 : 23) });
      const x = p[0].toFixed(1), y = p[1].toFixed(1);
      let pos, corps;
      if (lignes.length === 1) {
        pos = `x="${x}" y="${y}" dy="0.35em" font-size="${taille}"`;
        corps = xmlEsc(t);
      } else {
        pos = `x="${x}" y="${y}" font-size="${taille}"`;
        corps = lignes.map((l, k) => `<tspan x="${x}" dy="${k ? "1.1em"
          : (0.35 - 0.55 * (lignes.length - 1)).toFixed(2) + "em"}">${xmlEsc(l)}</tspan>`).join("");
      }
      // Le liseré suit le corps : 5 px autour d'un numéro de 12 px le noient.
      const ep = canton ? "" : ` stroke-width="${Math.max(2, Math.min(5, taille * 0.17)).toFixed(1)}"`;
      lis.push(`<text ${pos} stroke="${sur ? COMMONS.rougeTrait : "#ffffff"}"${ep}>${corps}</text>`);
      txt.push(`<text ${pos} fill="${sur ? "#ffffff" : "#1d1c1a"}">${corps}</text>`);
    }
    L.push(`<g id="${canton ? "noms" : "numeros"}" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" ` +
           `font-weight="bold" text-anchor="middle">`);
    L.push(`<g fill="none" stroke-width="${canton ? 3 : 5}" stroke-linejoin="round">${lis.join("")}</g>`);
    L.push(txt.join(""));
    L.push(`</g>`);
  }
  L.push(`</svg>`);
  return L.join("\n");
}

// ---------------------------------------------------------------------------
// Compositions
//
// Les deux couches se joignent par atome (pas avant 1870 : la base n'y tient
// que les circonscriptions). Une unité d'une couche qui touche plusieurs unités
// de l'autre y figure « (partie) ».
// ---------------------------------------------------------------------------
function compositionCroisee() {
  const kx = S.cfgCirco, kc = S.cfgCanton;
  if (!kx || !kc) return null;
  const parX = new Map(), parC = new Map();
  for (const [aid, cx] of Object.entries(kx.rattachement)) {
    const ck = kc.rattachement[aid];
    if (!ck) continue;
    if (!parX.has(cx)) parX.set(cx, new Set());
    parX.get(cx).add(ck);
    if (!parC.has(ck)) parC.set(ck, new Set());
    parC.get(ck).add(cx);
  }
  const ux = new Map(kx.unites.map(u => [u.id, u]));
  const uc = new Map(kc.unites.map(u => [u.id, u]));
  // « (partie) » ne se dit que d'un canton coupé entre circonscriptions : une
  // circonscription s'étend toujours sur plusieurs cantons, le dire de chacune
  // ne dirait rien.
  const liste = (par, inverse, unites) => {
    const r = new Map();
    for (const [k, s] of par)
      r.set(k, [...s].map(j => ({ u: unites.get(j), partie: !!inverse && inverse.get(j).size > 1 }))
                     .filter(e => e.u));
    return r;
  };
  return { cantonsDe: liste(parX, parC, uc), circosDe: liste(parC, null, ux) };
}

function cantonsParCirco() {
  const c = compositionCroisee();
  if (!c) return null;
  const r = new Map();
  for (const [cx, l] of c.cantonsDe)
    r.set(cx, l.map(e => (cantonParis(e.u) ? etiquetteCanton(e.u) + " arrondissement" : e.u.nom) +
                         (e.partie ? " (partie)" : ""))
      .sort((a, b) => a.localeCompare(b, "fr", { numeric: true })));
  return r;
}

// Les communes d'une unité, par nom. La clé est (code INSEE, nom) : deux
// homonymes du département restent deux communes, et les fractions d'une ville
// découpée retrouvent leur mère — qui est alors « (partie) » partout où elle
// est coupée.
function communesDe(niveau) {
  const k = niveau === "canton" ? S.cfgCanton : S.cfgCirco;
  const par = new Map(), unitesDe_ = new Map(), info = new Map();
  if (!k) return par;
  for (const [aid, uid] of Object.entries(k.rattachement)) {
    const c = S.communes[aid];
    const nom = nomCommuneWiki(aid);
    if (!c || !nom) continue;
    const cle = (c.i || c.s || aid) + "|" + nom;
    // Le nom de 2012, quand la commune a changé de nom depuis : le titre de
    // l'article est le plus souvent le nom actuel (Mirebeau → Mirebeau-sur-Bèze).
    const actuel = CX.cog && CX.cog[c.i];
    info.set(cle, { nom, dep: depDuCode(c.i),
                    actuel: actuel && actuel !== nom && c.nm && c.nm.length ? actuel : null });
    if (!par.has(uid)) par.set(uid, new Set());
    par.get(uid).add(cle);
    if (!unitesDe_.has(cle)) unitesDe_.set(cle, new Set());
    unitesDe_.get(cle).add(uid);
  }
  const r = new Map();
  for (const [uid, s] of par)
    r.set(uid, [...s].map(cle => Object.assign({ partie: unitesDe_.get(cle).size > 1 }, info.get(cle)))
      .sort((a, b) => a.nom.localeCompare(b.nom, "fr")));
  return r;
}

// ---------------------------------------------------------------------------
// Noms : communes, cantons, circonscriptions
// ---------------------------------------------------------------------------
const sansAccents = s => String(s).replace(/œ/g, "oe").replace(/Œ/g, "OE")
  .replace(/æ/g, "ae").replace(/Æ/g, "AE").normalize("NFD").replace(/[̀-ͯ]/g, "")
  .toUpperCase().replace(/^(L'|LE |LA |LES )/, "").replace(/[^A-Z0-9]+/g, "");
const PARTICULES = new Set(["de", "du", "des", "la", "le", "les", "sur", "sous",
  "en", "et", "lès", "lez", "les", "aux", "au", "d", "l", "à", "a"]);
function casseTitre(n) {
  return String(n).toLowerCase().split(/([-' ])/).map((m, i) =>
    /^[-' ]$/.test(m) || (i > 0 && PARTICULES.has(m)) ? m
      : m.charAt(0).toUpperCase() + m.slice(1)).join("");
}
// Le nom d'une commune à la date, en casse et accents : la chronologie des
// renommages d'abord (déjà typographiée), puis le COG 2012 si le nom en
// capitales de GEOFLA y concorde, et en dernier recours une casse de titre
// sans accents — que l'état des liens signale.
function nomCommuneWiki(aid) {
  const c = S.communes && S.communes[aid];
  if (!c) return null;
  if (c.nm && c.nm.length) return nomA(c, S.annee);
  const n = String(c.n || "");
  if (!n || n !== n.toUpperCase()) return n || null;
  const cog = CX.cog && CX.cog[c.i];
  if (cog && sansAccents(cog) === sansAccents(n)) return cog;
  const t = casseTitre(n);
  CX.devines.add(t);        // signalé s'il paraît dans le paragraphe
  return t;
}
function depDuCode(code) {
  if (!code) return null;
  const k = /^97/.test(code) ? code.slice(0, 3) : code.slice(0, 2);
  const d = S.index.departements.find(x => x.code === k);
  return d ? nomModerne(d) : null;
}

const maj = s => s.charAt(0).toUpperCase() + s.slice(1);
// Un canton de la Seine nommé « Paris-05 » est un arrondissement de Paris.
function cantonParis(u) {
  if (S.dep !== "75") return null;
  const m = /^Paris-0*(\d+)$/.exec(String(u.nom || ""));
  return m ? +m[1] : null;
}
const arrParis = n => `${n === 1 ? "1er" : n + "e"} arrondissement de Paris`;
// La préposition devant un nom de lieu : « d'Auxonne », « du Blanc »,
// « des Andelys », « de La Ferté-Macé », « de Beaune-Nord ». Le h n'est pas
// élidé : la page ne sait pas lequel est aspiré, la vérification des liens
// le dira.
function deLieu(nom) {
  let m;
  if ((m = /^Le (.+)$/.exec(nom))) return { prep: "du ", nom: m[1] };
  if ((m = /^Les (.+)$/.exec(nom))) return { prep: "des ", nom: m[1] };
  if (/^[AEIOUYÂÉÈÊÎÔ]/.test(nom)) return { prep: "d'", nom };
  return { prep: "de ", nom };
}
function nomCanton(u) {
  const n = cantonParis(u);
  if (n) return arrParis(n);
  const { prep, nom } = deLieu(String(u.nom || ""));
  return `canton ${prep}${nom}`;
}
function enCanton(u) {
  const n = cantonParis(u);
  if (n) {
    const s = n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd"
            : n % 10 === 3 && n !== 13 ? "rd" : "th";
    return `the ${n}${s} arrondissement of Paris`;
  }
  return `the canton of ${u.nom}`;
}

// Nombres en lettres (orthographe traditionnelle dans le texte : « vingt et
// une ») et ordinaux pour les titres d'articles, qui suivent l'usage de
// Wikipédia (« Vingt-et-unième circonscription du Nord »).
const UNITES_FR = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept",
  "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"];
const DIZAINES_FR = { 2: "vingt", 3: "trente", 4: "quarante", 5: "cinquante", 6: "soixante" };
function lettres(n, fem = false, trait = false) {
  const un = fem ? "une" : "un", et = trait ? "-et-" : " et ";
  if (n === 1) return un;
  if (n < 17) return UNITES_FR[n];
  if (n < 20) return "dix-" + UNITES_FR[n - 10];
  if (n < 70) {
    const d = DIZAINES_FR[Math.floor(n / 10)], u = n % 10;
    return u === 0 ? d : u === 1 ? d + et + un : d + "-" + UNITES_FR[u];
  }
  if (n < 80) return n === 71 ? "soixante" + et + "onze" : "soixante-" + lettres(n - 60, fem, trait);
  if (n === 80) return "quatre-vingts";
  if (n < 100) return "quatre-vingt-" + lettres(n - 80, fem, trait);
  return String(n);
}
function ordinalLettres(n) {
  if (n === 1) return "première";
  const c = lettres(n, false, true);
  if (c === "quatre-vingts") return "quatre-vingtième";
  return c.replace(/(un|cinq|neuf|e|)$/, m =>
    m === "un" ? "unième" : m === "cinq" ? "cinquième" : m === "neuf" ? "neuvième"
      : m === "e" ? "ième" : "ième");
}
const etListe = l => l.length <= 1 ? (l[0] || "") : l.slice(0, -1).join(", ") + " et " + l[l.length - 1];

// Une circonscription : son numéro départemental quand elle en a un
// (Gaudillère, 1946-1958, depuis 1958), sinon son nom (les circonscriptions
// d'arrondissement de 1876-1919 : « Beaune-1 », « Semur »).
function affCirco(u) {
  const nc = nomCommons(u);
  const m = /(\d+)(?:re|er|e) circonscription(?: \([^()]*\))?$/.exec(nc);
  if (m) return { n: +m[1], court: `${ordinal(m[1])} circonscription`,
                  prose: `${ordinal(m[1])} circonscription` };
  const v = /^(.+)-(\d+)$/.exec(nc);
  const de = s => { const { prep, nom } = deLieu(s); return prep + nom; };
  if (v) return { n: null, court: nc, prose: `${ordinal(v[2])} circonscription ${de(v[1])}` };
  if (/circonscription|collège/.test(nc)) return { n: null, court: nc, prose: `circonscription « ${nc} »` };
  return { n: null, court: nc, prose: `circonscription ${de(nc)}` };
}

// ---------------------------------------------------------------------------
// Nom de fichier, description, catégories

function contexte(plage) {
  const dep = S.index.departements.find(d => d.code === S.dep) || {};
  const { a0, a1 } = plage;
  return {
    dep, nomEpoque: nomDep(dep, S.annee), moderne: nomModerne(dep),

function fondCommunal(k) {

    : "ANR-COMMUNES, trame communale historique datée (Zenodo)" +

function assemble(X, a) {

`=={{int:filedesc}}==
{{Information

=={{int:license-header}}==
${COMMONS.licence}`;

function proposition(o, plage) {

function sourceCantonDe(annee) {
  const s = COMMONS.sourcesCantons.find(([a, b]) => annee >= a && annee <= b);
  return s ? s[2] : "base ''histgis''";

// ===========================================================================
// Paragraphe pour Wikipédia
//
// Le texte d'un article, et non plus la description d'un fichier : une phrase
// d'introduction, puis la composition de chaque unité, liens compris — sur le
// modèle du paragraphe de Paris en 1946 :
//
//   À compter de 1946, Paris comprend trois circonscriptions, sur les six
//   que compte le [[Seine (département)|département de la Seine]].
//   * [[Première circonscription de la Seine (Quatrième République)|1re
//     circonscription]] : [[5e arrondissement de Paris|5e]], … et
//     [[15e arrondissement de Paris|15e arrondissements]]
//
// Un titre d'article se devine mal (homonymes, « (Côte-d'Or) » ou non, canton
// redirigé vers sa commune) : chaque lien porte une liste de titres candidats,
// que `servir.py` soumet à fr.wikipedia. Le premier qui existe, n'est pas une
// page d'homonymie et — redirection suivie — mène bien à ce qu'on vise
// (« Canton… », « …circonscription… ») est retenu ; à défaut le lien reste
// rouge, et l'état sous le texte le dit.
// ===========================================================================
function lienWP(cands, aff, motif = null) {
  cands = cands.filter(Boolean);
  if (!cands.length) return aff;
  cands.forEach(t => CX.wpDemandes.add(t));
  const verifies = cands.every(t => CX.wp.has(t));
  let titre = null;
  for (const t of cands) {
    const r = CX.wp.get(t);
    if (!r || !r.existe || r.homonymie) continue;
    const c = r.cible || t;
    if (motif && !motif.test(c)) continue;
    titre = c;
    break;
  }
  if (titre) CX.wpBleus++;
  else {
    const homo = cands.find(t => (CX.wp.get(t) || {}).homonymie);
    titre = homo && homo !== cands[0] ? cands[0] : cands[cands.length - 1];
    if (verifies) {
      CX.wpRouges.set(titre, homo ? "homonymie" : "rouge");
      if ($c("c-w-rouges").checked) return aff;
    }
  }
  return maj(titre) === maj(aff) ? `[[${aff}]]` : `[[${titre}|${aff}]]`;
}

function titresCirco(n, X) {
  // Le régime se lit sur la première année du découpage ÉLECTORAL — pas sur
  // celle du découpage cantonal quand le paragraphe porte sur un canton.
  const a0 = CX.plages.circo ? CX.plages.circo.a0 : S.annee;
  const r = COMMONS.regimesWiki.find(([a, b]) => a0 >= a && a0 <= b);
  const suffixe = r ? r[2] : "";
  return [`${maj(ordinalLettres(n))} circonscription ${deDep(X.nomEpoque)}` +
          (suffixe ? ` (${suffixe})` : "")];
}
const RE_CIRCO = /circonscription/i, RE_CANTON = /^Canton /, RE_ARR = /arrondissement/;
function lienCirco(u, X, aff = null) {
  const a = affCirco(u);
  if (!a.n) return aff || a.court;
  return lienWP(titresCirco(a.n, X), aff || a.court, RE_CIRCO);
}
function titresCanton(u, X) {
  const n = cantonParis(u);
  if (n) return [arrParis(n)];
  const { prep, nom } = deLieu(String(u.nom || ""));
  const base = `Canton ${prep}${nom}`;
  return [`${base} (${X.nomEpoque})`, X.moderne !== X.nomEpoque ? `${base} (${X.moderne})` : null, base];
}
function lienCanton(u, X) {
  const n = cantonParis(u);
  if (n) return lienWP([arrParis(n)], `${n === 1 ? "1er" : n + "e"} arrondissement`, RE_ARR);
  return lienWP(titresCanton(u, X), String(u.nom || ""), RE_CANTON);
}
function lienCommune(c) {
  if (CX.devines.has(c.nom)) CX.nomsDevines.add(c.nom);
  return lienWP([c.dep ? `${c.nom} (${c.dep})` : null, c.nom,
                 c.actuel && c.dep ? `${c.actuel} (${c.dep})` : null, c.actuel], c.nom) +
         (c.partie ? " (partie)" : "");
}
function lienDep(X) {
  return lienWP([`${X.nomEpoque} (département)`, X.nomEpoque],
                `département ${deDep(X.nomEpoque)}`, /département|^[^(]+$/);
}
function phrasePeriode() {
  const p = CX.plage;
  if (p.a0 === p.a1) return `En ${p.a0}`;
  if (p.ouvertFin) return `À compter de ${p.a0}`;
  return `De ${p.a0} à ${p.a1}`;
}
function listeCommunes(cs) {
  return `${cs.length} commune${cs.length > 1 ? "s" : ""} (${etListe(cs.map(lienCommune))})`;
}

// Ce qui compose une circonscription : arrondissements de Paris, cantons, ou
// à défaut de couche cantonale ses communes (comptées, ou listées sur demande).
function compoCirco(u, X, croise, communes, lister, prose) {
  const ks = croise && croise.cantonsDe.get(u.id);
  if (ks && ks.length) {
    const arr = ks.filter(e => cantonParis(e.u)).sort((a, b) => cantonParis(a.u) - cantonParis(b.u));
    const cts = ks.filter(e => !cantonParis(e.u))
      .sort((a, b) => String(a.u.nom).localeCompare(String(b.u.nom), "fr"));
    const morceaux = [];
    if (arr.length) {
      const l = arr.map((e, i) => {
        const n = cantonParis(e.u), ord = n === 1 ? "1er" : n + "e";
        const aff = i === arr.length - 1 ? `${ord} arrondissement${arr.length > 1 ? "s" : ""}` : ord;
        return lienWP([arrParis(n)], aff, RE_ARR) + (e.partie ? " (partie)" : "");
      });
      morceaux.push((prose ? (arr.length > 1 ? "les " : "le ") : "") + etListe(l));
    }
    if (cts.length) {
      const l = cts.map(e => {
        const { prep, nom } = deLieu(String(e.u.nom || ""));
        return prep + lienWP(titresCanton(e.u, X), nom, RE_CANTON) + (e.partie ? " (partie)" : "");
      });
      morceaux.push((prose ? (cts.length > 1 ? "les " : "le ") : "") +
                    (cts.length > 1 ? "cantons " : "canton ") + etListe(l));
    }
    return morceaux.join(prose ? " et " : " ; ");
  }
  const cs = (communes && communes.get(u.id)) || [];
  if (!cs.length) return `${u.n} commune${u.n > 1 ? "s" : ""}`;
  return lister ? listeCommunes(cs) : `${cs.length} commune${cs.length > 1 ? "s" : ""}`;
}

function paragrapheWiki(o) {
  CX.wpDemandes = new Set(); CX.wpRouges = new Map(); CX.wpBleus = 0;
  CX.nomsDevines = new Set();
  if (o.niveau === "liste") return wikiListe();
  const X = contexte(CX.plage);
  const lister = $c("c-w-communes").checked;
  return o.niveau === "canton" ? wikiCantons(o, X, lister) : wikiCircos(o, X, lister);
}

function wikiCircos(o, X, lister) {
  const unites = unitesDe("circo");
  const croise = compositionCroisee();
  const communes = communesDe("circo");
  const per = phrasePeriode();
  const liste = unites.length === 1 && unites[0].regime === "liste";
  const cible = o.type === "situation" ? unites.find(u => u.id === o.unite) : null;
  if (cible) {
    const a = affCirco(cible);
    return `${per}, la ${a.prose}${a.n ? " " + deDep(X.nomEpoque) : ""} comprend ` +
           compoCirco(cible, X, croise, communes, lister, true) + ".";
  }
  if (liste)
    return `${per}, le ${lienDep(X)} forme une seule circonscription, ` +
           `dont les députés sont élus au scrutin de liste.`;
  // « 1re circonscription » quand elle a un numéro départemental, sinon
  // « 1re circonscription de Beaune », « circonscription de Semur ».
  const puce = u => `* ${lienCirco(u, X, affCirco(u).n ? null : maj(affCirco(u).prose))} : ` +
                    compoCirco(u, X, croise, communes, lister, false);
  const paris = S.dep === "75" ? unites.filter(u => /^Paris\b/.test(nomCommons(u))) : [];
  if (paris.length && paris.length < unites.length) {
    const reste = unites.filter(u => !paris.includes(u));
    return `${per}, Paris comprend ${lettres(paris.length, true)} circonscription` +
      `${paris.length > 1 ? "s" : ""}, sur les ${lettres(unites.length, true)} que compte ` +
      `le ${lienDep(X)}.\n\n` + paris.map(puce).join("\n") +
      `\n\nLe reste du département ${reste.length > 1 ? "forme les " + lettres(reste.length, true) +
        " autres circonscriptions" : "forme la dernière circonscription"} :\n\n` +
      reste.map(puce).join("\n");
  }
  return `${per}, le ${lienDep(X)} comprend ${lettres(unites.length, true)} circonscription` +
         `${unites.length > 1 ? "s" : ""}.\n\n` + unites.map(puce).join("\n");
}

function wikiCantons(o, X, lister) {
  const unites = unitesDe("canton");
  const croise = compositionCroisee();
  const communes = communesDe("canton");
  const per = phrasePeriode();
  const cible = o.type === "situation" ? unites.find(u => u.id === o.unite) : null;
  if (cible) {
    const cs = communes.get(cible.id) || [];
    const n = cantonParis(cible);
    let t = n
      ? `${per}, le ${arrParis(n)} forme un canton ${deDep(X.nomEpoque)}.`
      : `${per}, le ${nomCanton(cible)} comprend ${lettres(cs.length || cible.n)} commune` +
        `${(cs.length || cible.n) > 1 ? "s" : ""}` +
        (cs.length ? ` : ${etListe(cs.map(lienCommune))}.` : ".");
    // Au scrutin de liste départemental, la circonscription est le
    // département : rien à dire. Pas quand il en forme plusieurs (1919-1928).
    const seule = unitesDe("circo").length < 2;
    const xs = croise && (croise.circosDe.get(cible.id) || [])
      .filter(e => !seule || (e.u.regime !== "liste" && !/^L/.test(String(e.u.code || ""))));
    if (xs && xs.length) {
      const l = xs.map(e => "la " + lienCirco(e.u, X));
      t += xs.length === 1
        ? ` Il fait partie de ${l[0]}${affCirco(xs[0].u).n ? " " + deDep(X.nomEpoque) : ""}.`
        : ` Il est partagé entre ${etListe(l)}.`;
    }
    return t;
  }
  const puce = u => {
    if (cantonParis(u)) return `* ${lienCanton(u, X)}`;
    const cs = communes.get(u.id) || [];
    const nb = cs.length || u.n;
    return `* ${lienCanton(u, X)} : ` +
      (lister && cs.length ? listeCommunes(cs) : `${nb} commune${nb > 1 ? "s" : ""}`);
  };
  const np = unites.filter(cantonParis).length;
  return `${per}, le ${lienDep(X)} comprend ${lettres(unites.length)} canton` +
         `${unites.length > 1 ? "s" : ""}` +
         (np ? `, dont les ${lettres(np)} arrondissements de Paris` : "") + `.\n\n` +
         unites.map(puce).join("\n");
}

function afficheEtatLiens() {

    const r = [...CX.wpRouges];

function majWiki(force = false) {

function verifieLiensBientot(delai = 300) {

  CX.minuterieWP = setTimeout(verifieLiens, delai);
}
async function verifieLiens() {

// ===========================================================================
// Carte d'une liste de communes — 6 octobre 2026
//
// Une AOP, une communauté de communes, un pays, un parc : un ensemble de
// communes qui ne suit ni les cantons ni, souvent, les départements. On saisit
// la liste (noms ou codes INSEE), la page la résout, charge le ou les
// départements qu'elle touche, et dessine l'une de deux images :
//
//   * la carte des communes : les départements concernés en grisé, leurs
//     communes en trait blanc, celles de la liste en rouge — avec, en
//     médaillon, la France des départements, ceux de la liste en rouge ;
//   * la situation en France : le médaillon en grand, les communes en rouge
//     sur leurs départements rosés.
//
// La liste se donne avec les noms d'AUJOURD'HUI, la base parle le COG 2012.
// `fonds_communes.py` fait le pont : `cog_actuel.json` ramène chaque commune
// nouvelle (Haut Valromey, Cherbourg-en-Cotentin) aux communes de 2012 qui la
// composent, et la carte la dessine par elles. `france.json` porte le
// médaillon, simplifié à 800 m et daté par époques (1871, 1919, 1968).
//
// Le fond communal est celui d'une année — par défaut la dernière de la base —
// lu comme la page le lit : une commune, ce sont les atomes que la composition
// de cette année rattache au département et qui portent son code INSEE
// (Premeaux ET Prissey pour Premeaux-Prissey). Les fichiers d'un département
// tiennent aussi les communes qu'il a perdues (la Seine-et-Oise garde
// Corbreuse après 1968) : sans la composition de l'année, l'Yvelines de 1990
// s'étendrait jusqu'à Étampes. Rien n'est recalculé.
// ===========================================================================
const EPOQUES_DEP = [-10000, 1871, 1919, 1968];    // les mêmes que fonds_communes.py
const CL = { cogActuel: null, inactives: new Set(), millesime: null, france: null,
             absents: [], index: null, res: null, minuterie: null, minTexte: null, jeton: 0 };

async function chargeFondsListe() {
  const essaie = async (f, defaut) => {
    try { return await charge(`${RACINE}/${f}`); }
    catch (e) { if (!CL.absents.includes(f)) CL.absents.push(f); return defaut; }
  };
  if (!CL.cogActuel) {
    const j = await essaie("cog_actuel.json", {});
    CL.cogActuel = j.communes || {};
    CL.inactives = new Set(j.inactives_2012 || []);
    CL.millesime = j.millesime || null;
  }
  if (!CL.france) CL.france = (await essaie("france.json", {})).departements || {};
  await chargeCog();
}

// « St-Jean » et « Saint-Jean », « Le Creusot » et « Creusot », « Époisses »
// et « EPOISSES » : une seule clé.
const cleNom = s => sansAccents(String(s).trim()
  .replace(/\bSte\b\.?/gi, "Sainte").replace(/\bSt\b\.?/gi, "Saint"));
const depDeCode = code => /^97/.test(code) ? code.slice(0, 3) : code.slice(0, 2);
const RE_CODE = /\b(\d[\dAB]\d{3})\b/i;

// L'index des noms : communes d'aujourd'hui d'abord (rang 0), puis le COG
// 2012 — les communes actives en 2012 (1), celles qu'une commune nouvelle a
// absorbées depuis (2), celles qui n'étaient déjà plus des communes (3). Le
// rang ne départage que des homonymes ; il n'écarte jamais un nom unique.
function indexNoms() {
  if (CL.index) return CL.index;
  const ix = new Map(), parCode = new Map(), absorbes = new Set();
  const ajoute = e => {
    const k = cleNom(e.nom);
    if (!ix.has(k)) ix.set(k, []);
    ix.get(k).push(e);
  };
  for (const [code, [nom, membres]] of Object.entries(CL.cogActuel || {})) {
    const e = { code, nom, membres, rang: 0 };
    ajoute(e); parCode.set(code, e);
    membres.forEach(m => { if (membres.length > 1 || m !== code) absorbes.add(m); });
  }
  for (const [code, nom] of Object.entries(CX.cog || {})) {
    const rang = absorbes.has(code) ? 2 : CL.inactives.has(code) ? 3 : 1;
    const e = { code, nom, membres: [code], rang };
    ajoute(e);
    if (!parCode.has(code)) parCode.set(code, e);
  }
  CL.index = { ix, parCode };
  return CL.index;
}

// « Montbard (21) », « Montbard (Côte-d'Or) » : le département qui lève une
// homonymie. Un qualificatif qui n'en est pas un reste dans le nom.
function depDeQualif(q) {
  q = String(q).trim();
  if (/^(\d{1,2}|2[AB]|97\d)$/i.test(q)) return q.toUpperCase().padStart(2, "0");
  const k = cleNom(q);
  for (const d of S.index.departements) {
    const noms = [d.nom, ...(d.noms || []).map(x => x[2])];
    if (noms.some(n => cleNom(n) === k)) return d.code;
  }
  return null;
}
function depsFiltre(texte) {
  const s = new Set();
  String(texte || "").split(/[,;\n]+/)
    .flatMap(t => /^[\s\dAB]+$/i.test(t) ? t.trim().split(/\s+/) : [t])
    .map(t => t.trim()).filter(Boolean)
    .forEach(t => { const d = depDeQualif(t); if (d) s.add(d); });
  return s;
}
function analyseLigne(brut) {
  const s = brut.replace(/^\s*(?:[-*•·–]|\d{1,3}[.)])\s+/, "").trim();
  const mc = RE_CODE.exec(s);
  if (mc) return { brut, code: mc[1].toUpperCase(), nom: s.replace(RE_CODE, "").replace(/^[\s\t|:-]+|[\s\t|:-]+$/g, "") };
  const m = /^(.+?)\s*\(([^()]+)\)$/.exec(s);
  if (m) { const d = depDeQualif(m[2]); if (d) return { brut, nom: m[1], dep: d }; }
  return { brut, nom: s };
}

function resoutListe(texte, filtre) {
  const { ix, parCode } = indexNoms();
  const lignes = texte.split(/[\n;,]+/).map(s => s.trim()).filter(Boolean).map(brut => {
    const a = analyseLigne(brut);
    let cands = [];
    if (a.code && parCode.has(a.code)) cands = [parCode.get(a.code)];
    else if (a.nom) cands = ix.get(cleNom(a.nom)) || [];
    const parC = new Map();          // un code sous deux graphies : une fois
    for (const e of cands) if (!parC.has(e.code) || e.rang < parC.get(e.code).rang) parC.set(e.code, e);
    cands = [...parC.values()];
    if (a.dep) cands = cands.filter(e => depDeCode(e.code) === a.dep);
    if (filtre.size) cands = cands.filter(e => filtre.has(depDeCode(e.code)));
    if (cands.length > 1) {
      const r = Math.min(...cands.map(e => e.rang));
      cands = cands.filter(e => e.rang === r);
    }
    return { brut, cands, e: cands.length === 1 ? cands[0] : null };
  });
  // Un homonyme se départage par les départements des communes sûres : une
  // AOP de Bourgogne qui dit « Saint-Romain » ne parle pas de la Vienne.
  const sures = new Set(lignes.filter(l => l.e).map(l => depDeCode(l.e.code)));
  for (const l of lignes) {
    if (l.e || l.cands.length < 2) continue;
    const c = l.cands.filter(e => sures.has(depDeCode(e.code)));
    if (c.length === 1) { l.e = c[0]; l.deduit = true; }
  }
  const vus = new Set();
  for (const l of lignes) {
    if (l.e && vus.has(l.e.code)) { l.doublon = true; l.e = null; }
    else if (l.e) vus.add(l.e.code);
  }
  return lignes;
}

// Le dossier d'export qui tient une commune à une date. Le code dit le
// département d'aujourd'hui ; avant 1968, l'Essonne est en Seine-et-Oise,
// avant 1976 la Corse-du-Sud en Corse, avant 1871 Belfort dans le Haut-Rhin.
function dossiersPour(code, Y) {
  const d = depDeCode(code);
  let l = [d];
  if ((d === "2A" || d === "2B") && Y < 1976) l = ["20", d];
  else if ((d === "91" || d === "95") && Y < 1968) l = ["78", "75"];
  else if ((d === "92" || d === "93" || d === "94") && Y < 1968) l = ["75", "78"];
  else if (d === "90" && Y < 1871) l = ["68"];
  else if ((d === "54" || d === "57") && Y < 1871) l = [d, d === "54" ? "57" : "54"];
  const ok = new Set(S.index.departements.filter(x => {
    const [a, b] = x.bornes || [AN_MIN, AN_MAX];
    return Y >= a && Y <= b;
  }).map(x => x.code));
  return l.filter(x => ok.has(x));
}

async function chargeDossier(code, Y) {
  const base = `${RACINE}/dep/${code}`;
  const [idx, com, cont] = await Promise.all([
    charge(`${base}/index.json`), charge(`${base}/communes.json`),
    charge(`${base}/contours.json`).catch(() => ({})),
  ]);
  if ((idx.absences || []).some(([a, b]) => Y >= a && Y <= b)) return null;
  const e = (idx.annees || {})[String(Y)] || {};
  const [c, x] = await Promise.all([
    e.c ? charge(`${base}/c_${e.c}.json`) : null,
    e.x ? charge(`${base}/x_${e.x}.json`) : null,
  ]);
  const rat = new Set([...Object.keys((c && c.rattachement) || {}),
                       ...Object.keys((x && x.rattachement) || {})]);
  const dep = S.index.departements.find(d => d.code === code) || { code, nom: code };
  return { code, dep, nomEpoque: nomDep(dep, Y), moderne: nomModerne(dep),
           communes: com.communes, contours: cont, rat: rat.size ? rat : null, Y };
}

// Les atomes dessinables d'un dossier à la date : ceux que la composition de
// l'année rattache, et ceux dont le code désigne ce dossier à cette date. Le
// second critère seul écarterait déjà Corbreuse de l'Yvelines de 1990 ; le
// premier ne suffit pas seul : une ville partagée entre cantons que la base
// ne découpe pas (Saint-Denis de La Réunion) n'est rattachée à aucun.
function atomesDe(D) {
  if (D._atomes) return D._atomes;
  const out = [];
  for (const [aid, c] of Object.entries(D.communes)) {
    if (!(D.rat && D.rat.has(aid)) && !(c.i && dossiersPour(c.i, D.Y).includes(D.code))) continue;
    const v = versionA(c, D.Y);
    if (v && v.g) out.push({ aid, c, v });
  }
  return (D._atomes = out);
}

function aireApprox(g) {
  let s = 0;
  for (const poly of polygonesDe(g)) poly.forEach((r, k) => {
    let a = 0;
    for (let i = 0; i < r.length - 1; i++) a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
    s += (k ? -1 : 1) * Math.abs(a) / 2;
  });
  return s;
}
// Le contour du département : `contours.json` est, pour chaque année servie,
// l'union des communes de la composition — trouée quand celle-ci est
// incomplète (la Côte-d'Or perd 125 km² en 1955). On prend le plus étendu de
// l'époque de la date, comme `fonds_communes.py` pour le médaillon. À défaut,
// les communes elles-mêmes.
function contourDossier(D) {
  const ks = Object.keys(D.contours || {}).map(Number).sort((a, b) => a - b);
  const ep = y => EPOQUES_DEP.filter(b => y >= b).length - 1;
  let cands = ks.filter(k => ep(k) === ep(D.Y));
  if (!cands.length && ks.length)
    cands = [ks.reduce((a, b) => Math.abs(b - D.Y) < Math.abs(a - D.Y) ? b : a)];
  let best = null, ba = -1;
  for (const k of cands) {
    const g = D.contours[String(k)], a = aireApprox(g);
    if (a > ba) { ba = a; best = g; }
  }
  return best || { type: "GeometryCollection", geometries: atomesDe(D).map(a => a.v.g) };
}
// Les limites communales de fond : un trait par polygone, quel que soit le
// nombre d'atomes qui le revendiquent ; une fraction de ville ne double pas
// sa mère quand celle-ci est dessinée.
function fondCommunes(D) {
  const meres = new Set(atomesDe(D).filter(a => !a.c.f).map(a => a.c.i));
  const vus = new Set(), out = [];
  for (const a of atomesDe(D)) {
    if (a.c.f && meres.has(a.c.i)) continue;
    const k = a.v.k || a.aid;
    if (vus.has(k)) continue;
    vus.add(k); out.push(a.v.g);
  }
  return out;
}

function anneeListe() {
  const v = parseInt($c("c-annee-liste").value, 10);
  const max = (S.index && S.index.an_max) || AN_MAX;
  return Number.isFinite(v) ? Math.min(max, Math.max(AN_MIN, v)) : max;
}

async function prepareListe() {
  const j = ++CL.jeton;
  await chargeFondsListe();
  if (j !== CL.jeton) return;
  const Y = anneeListe(), texte = $c("c-liste").value;
  if (!texte.trim()) { CL.res = null; afficheEtatListe(); return; }
  $c("c-liste-etat").innerHTML = `<span class="note">résolution de la liste et chargement des départements…</span>`;
  const lignes = resoutListe(texte, depsFiltre($c("c-filtre").value));
  const codes = new Set();
  lignes.forEach(l => l.e && l.e.membres.forEach(m => dossiersPour(m, Y).forEach(d => codes.add(d))));
  const D = new Map(), echecs = [];
  await Promise.all([...codes].map(async c => {
    try { const d = await chargeDossier(c, Y); if (d) D.set(c, d); }
    catch (err) { echecs.push(c); }
  }));
  if (j !== CL.jeton) return;
  const choisies = [];
  for (const l of lignes) {
    if (!l.e) { l.statut = l.doublon ? "doublon" : l.cands.length > 1 ? "ambigu" : "inconnu"; continue; }
    const atomes = [], manquants = [];
    for (const m of l.e.membres) {
      const nomM = cleNom((CX.cog && CX.cog[m]) || l.e.nom);
      let pris = false;
      for (const dc of dossiersPour(m, Y)) {
        const d = D.get(dc);
        if (!d) continue;
        let h = atomesDe(d).filter(a => a.c.i === m);
        // Une commune disparue avant 2012 n'a pas d'atome à son code (l'atome
        // porte celui de la commune qui l'a absorbée) : on la cherche par nom.
        if (!h.length) h = atomesDe(d).filter(a =>
          cleNom(nomA(a.c, Y) || "") === nomM || cleNom(a.c.n || "") === nomM);
        if (h.length) { h.forEach(a => atomes.push(Object.assign({ d }, a))); pris = true; break; }
      }
      if (!pris) manquants.push(m);
    }
    l.manquants = manquants;
    if (!atomes.length) { l.statut = "sansForme"; continue; }
    l.statut = "ok";
    choisies.push({ e: l.e, nom: l.e.nom, atomes, dossier: atomes[0].d.code });
  }
  const utiles = [...new Set(choisies.map(c => c.dossier))].sort();
  const dossiers = utiles.map(c => {
    const d = D.get(c);
    d.contour = contourDossier(d);
    d.sansCompo = !d.rat;
    return d;
  });
  choisies.sort((a, b) => a.dossier.localeCompare(b.dossier) || a.nom.localeCompare(b.nom, "fr"));
  CL.res = { Y, lignes, choisies, dossiers, echecs };
  const defaut = (id, v) => { if (!$c(id).dataset.touche) $c(id).checked = v; };
  defaut("c-l-noms", choisies.length <= 30);
  defaut("c-l-deps", dossiers.length > 1);
  afficheEtatListe();
}

// Un clic sur un homonyme écrit son code devant le nom, dans la liste même :

function precise(brut, code) {
