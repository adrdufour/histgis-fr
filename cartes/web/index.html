// La France des départements à une date, pour le médaillon. Avant 1870 la
// base n'a pas de contour : on prend la France de 1870. L'outre-mer (`dom`)
// n'y paraît qu'à partir de sa départementalisation (1946, Mayotte 2011) :
// avant, ce sont des colonies, et la carte des départements ne les montre pas.
function franceA(Y) {
  const Ye = Math.max(Y, 1870), out = [];
  for (const [code, d] of Object.entries(CL.france || {})) {
    const [a, b] = d.bornes || [AN_MIN, AN_MAX];
    if (Ye < Math.max(a, 1870) || Ye > b) continue;
    if ((d.absences || []).some(([x, y]) => Ye >= x && Ye <= y)) continue;
    let v = d.v[0];
    for (const w of d.v) if (w.a <= Ye) v = w;
    out.push({ code, g: v.g, dom: !!d.outremer });
  }
  return out;
}

// La France entière en un plan : la métropole, et l'outre-mer en cases
// empilées en bas à gauche, sur l'Atlantique — la disposition des cartes de
// France de Wikipédia. Chaque case a sa propre échelle (la Guyane y est plus
// petite que la Martinique) : c'est l'usage, et le cadre de la case le dit.
// Une `partie` = un département, sa projection et son décalage dans l'image.
function planFrance(fr, largeur, marge = 12) {
  const metro = fr.filter(f => !f.dom), dom = fr.filter(f => f.dom)
    .sort((a, b) => a.code.localeCompare(b.code));
  const P = fabriqueProjection(metro.map(f => f.g), largeur, marge);
  const parties = metro.map(f => ({ f, P, x: 0, y: 0 })), cases = [];
  if (dom.length) {
    const c = Math.max(24, Math.round(P.W * 0.105)), gap = Math.max(3, Math.round(c * 0.07));
    const x0 = Math.max(2, Math.round(marge / 2));
    let y = P.H - Math.max(2, Math.round(marge / 2)) - dom.length * c - (dom.length - 1) * gap;
    for (const f of dom) {
      const Pd = fabriqueProjection([f.g], c, Math.max(2, Math.round(c * 0.06)));
      parties.push({ f, P: Pd, x: x0 + (c - Pd.W) / 2, y: y + (c - Pd.H) / 2 });
      cases.push({ x: x0, y, c, code: f.code });
      y += c + gap;
    }
  }
  return { W: P.W, H: P.H, parties, cases };
}
const decale = p => p.x || p.y ? ` transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"` : "";
// Un chemin par partie décalée, un seul pour toute la métropole.
function cheminPlan(plan, garde, attrs) {
  const out = [], metro = plan.parties.filter(p => !p.f.dom && garde(p.f));
  if (metro.length) out.push(`<path ${attrs} d="${metro.map(p => cheminPx(p.f.g, p.P)).join("")}"/>`);
  for (const p of plan.parties.filter(p => p.f.dom && garde(p.f)))
    out.push(`<path${decale(p)} ${attrs} d="${cheminPx(p.f.g, p.P)}"/>`);
  return out.join("");
}
const casesPlan = (plan, epaisseur) => plan.cases.map(k =>
  `<rect x="${k.x + .5}" y="${k.y + .5}" width="${k.c - 1}" height="${k.c - 1}" ` +
  `fill="#ffffff" stroke="#8f897f" stroke-width="${epaisseur}"/>`).join("");

// Le médaillon se pose dans le coin le plus vide ; si aucun ne l'est assez
// (un ensemble qui remplit son cadre), on élargit l'image à droite — ou en
// bas pour une carte en largeur — plutôt que de couvrir des communes.
function placeMedaillon(R, P, W, H, Pf) {
  const simples = new Map(franceA(R.Y).map(f => [f.code, f.g]));
  const anneaux = [];
  for (const d of R.dossiers)
    for (const poly of polygonesDe(simples.get(d.code) || d.contour))
      anneaux.push(poly[0].map(c => P.px(c[0], c[1])));
  const dedans = (x, y) => anneaux.some(r => {
    let c = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++)
      if ((r[i][1] > y) !== (r[j][1] > y) &&
          x < (r[j][0] - r[i][0]) * (y - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0]) c = !c;
    return c;
  });
  const w = Pf.W, h = Pf.H, m = 8;
  let best = null, bestC = 2;
  for (const [x, y] of [[W - w - m, m], [m, m], [W - w - m, H - h - m], [m, H - h - m]]) {
    if (x < 0 || y < 0) continue;
    let n = 0;
    for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++)
      if (dedans(x + w * i / 10, y + h * j / 10)) n++;
    if (n / 121 < bestC) { bestC = n / 121; best = [x, y]; }
  }
  if (best && bestC <= 0.04) return { x: best[0], y: best[1], W, H, Pf };
  return W <= H * 1.25 ? { x: W, y: m + 4, W: W + w + m, H: Math.max(H, h + 2 * m), Pf }
                       : { x: W - w - m, y: H, W, H: H + h + m, Pf };
}

const POLICE = "DejaVu Sans, Liberation Sans, Arial, sans-serif";
// Des noms avec liseré : un second <text> dessous, comme pour les cantons.
function etiquettesSVG(id, items, attrs) {
  if (!items.length) return "";
  const lis = [], txt = [];
  for (const { x, y, t, taille, ancre } of items) {
    const pos = `x="${x.toFixed(1)}" y="${y.toFixed(1)}" dy="0.35em" font-size="${taille}"` +
                (ancre ? ` text-anchor="${ancre}"` : "");
    lis.push(`<text ${pos}>${xmlEsc(t)}</text>`);
    txt.push(`<text ${pos}>${xmlEsc(t)}</text>`);
  }
  return `<g id="${id}" font-family="${POLICE}" text-anchor="middle" ${attrs.texte}>` +
    `<g fill="none" stroke="#ffffff" stroke-width="${attrs.halo}" stroke-linejoin="round">${lis.join("")}</g>` +
    `<g stroke="none">${txt.join("")}</g></g>`;
}
const geomCommune = c => ({ type: "GeometryCollection", geometries: c.atomes.map(a => a.v.g) });
// Une commune de quelques pixels (Saint-Jean-de-Losne : 1,6 km²) disparaît
// sous ses limites et sous son propre nom : on la marque d'un point, et son nom
// se pose à côté. `rayon` : en deçà de ce rayon libre (pixels), le point.
// `P` : une projection, ou une fonction commune -> partie {P, x, y} quand les
// communes ne sont pas toutes dans le même repère (l'outre-mer en cases).
function reperesSVG(R, P, rayon, r) {
  const poles = R.choisies.map(c => {
    const q = typeof P === "function" ? P(c) : { P, x: 0, y: 0 };
    const p = q && poleInterieur(geomCommune(c), q.P);
    if (p) { p[0] += q.x; p[1] += q.y; }
    return p;
  });
  const pts = poles.filter(p => p && p.d < rayon)
    .map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}"/>`);
  return { poles, svg: pts.length ? `<g id="reperes" fill="${COMMONS.rouge}" stroke="#ffffff" ` +
    `stroke-width="1">${pts.join("")}</g>` : "" };
}

function fabriqueSVGListe(o) {
  return o.typeListe === "france" ? svgListeFrance(o) : svgListeCommunes(o);
}
function enteteSVG(L, W, H, o) {
  L.push(`<?xml version="1.0" encoding="UTF-8"?>`);
  L.push(`<svg xmlns="http://www.w3.org/2000/svg" version="1.1" ` +
         `width="${Math.round(W)}" height="${Math.round(H)}" viewBox="0 0 ${Math.round(W)} ${Math.round(H)}">`);
  L.push(`<title>${xmlEsc(o.titre)}</title>`);
  L.push(`<desc>${xmlEsc(o.desc)}</desc>`);
}

function svgListeCommunes(o) {
  const R = CL.res;
  const P = fabriqueProjection(R.dossiers.map(d => d.contour));
  let W = P.W, H = P.H, med = null;
  const fr = o.medaillon ? franceA(R.Y) : [];
  if (fr.length) {
    const tw = Math.round(Math.max(170, 0.27 * Math.max(W, H)));
    med = placeMedaillon(R, P, W, H, planFrance(fr, tw, 5));
    W = med.W; H = med.H;
  }
  const L = [];
  enteteSVG(L, W, H, o);
  // 1. départements en grisé, 2. communes de la liste en rouge
  L.push(`<g id="departements" fill="#f1ede4" stroke="none" fill-rule="evenodd">`);
  R.dossiers.forEach(d => L.push(`<path id="dep-${d.code}" d="${cheminPx(d.contour, P)}"/>`));
  L.push(`</g>`);
  L.push(`<g id="communes-choisies" fill="${COMMONS.rouge}" stroke="none" fill-rule="evenodd">`);
  R.choisies.forEach(c => c.atomes.forEach(a => L.push(`<path d="${cheminPx(a.v.g, P)}"/>`)));
  L.push(`</g>`);
  // 3. limites communales, puis départementales
  if (o.communes) {
    const d = R.dossiers.flatMap(D => fondCommunes(D).map(g => cheminPx(g, P)));
    L.push(`<path id="communes" fill="none" stroke="#ffffff" stroke-opacity=".85" ` +
           `stroke-width="0.5" stroke-linejoin="round" d="${d.join("")}"/>`);
  }
  L.push(`<path id="limites-departementales" fill="none" stroke="#5d574f" stroke-width="1.4" ` +
         `stroke-linejoin="round" d="${R.dossiers.map(d => cheminPx(d.contour, P)).join("")}"/>`);
  const rep = reperesSVG(R, P, 3, 3.5);
  L.push(rep.svg);
  // 4. noms
  if (o.nomsDeps) {
    const it = R.dossiers.map(d => {
      const p = poleInterieur(d.contour, P);
      return p && { x: p[0], y: p[1], t: d.nomEpoque, taille: Math.max(13, Math.min(24, Math.round(p.d / 5))) };
    }).filter(Boolean);
    L.push(etiquettesSVG("noms-departements", it,
      { texte: `fill="#6b6864" font-style="italic" letter-spacing="1"`, halo: 4 }));
  }
  if (o.nomsCommunes) {
    const it = R.choisies.map((c, i) => {
      const p = rep.poles[i];
      if (!p) return null;
      if (p.d >= 8) return { x: p[0], y: p[1], t: c.nom, taille: 11 };
      // à côté du point, à droite — à gauche si le nom sortirait du cadre
      const dx = Math.max(p.d, 4) + 2, large = 0.62 * 11 * c.nom.length;
      return p[0] + dx + large > P.W - 4
        ? { x: p[0] - dx, y: p[1], t: c.nom, taille: 11, ancre: "end" }
        : { x: p[0] + dx, y: p[1], t: c.nom, taille: 11, ancre: "start" };
    }).filter(Boolean);
    L.push(etiquettesSVG("noms-communes", it, { texte: `fill="#1d1c1a" font-weight="bold"`, halo: 3 }));
  }
  // 5. médaillon : la France des départements, ceux de la liste en rouge
  if (med) {
    const { Pf } = med, sel = new Set(R.dossiers.map(d => d.code));
    L.push(`<g id="medaillon" transform="translate(${med.x.toFixed(1)} ${med.y.toFixed(1)})">`);
    L.push(`<rect x="0.5" y="0.5" width="${Pf.W - 1}" height="${Pf.H - 1}" fill="#ffffff" stroke="#8f897f" stroke-width="1"/>`);
    L.push(casesPlan(Pf, 0.6));
    L.push(cheminPlan(Pf, f => !sel.has(f.code),
      `fill="#e4dfd5" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round"`));
    L.push(cheminPlan(Pf, f => sel.has(f.code),
      `fill="${COMMONS.rouge}" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round"`));
    L.push(`</g>`);
  }
  L.push(`</svg>`);
  return L.join("\n");
}

function svgListeFrance(o) {
  const R = CL.res, fr = franceA(R.Y);
  if (!fr.length) return svgListeCommunes(Object.assign({}, o, { medaillon: false }));
  const plan = planFrance(fr, COMMONS.largeurMax);
  const sel = new Set(R.dossiers.map(d => d.code));
  const metro = plan.parties.find(p => !p.f.dom);
  const partieDe = c => plan.parties.find(p => p.f.code === c.dossier) || metro;
  const L = [];
  enteteSVG(L, plan.W, plan.H, o);
  L.push(`<g id="outre-mer">${casesPlan(plan, 0.8)}</g>`);
  L.push(`<g id="departements" fill="#f1ede4" stroke="none">` +
         cheminPlan(plan, f => !sel.has(f.code), "") + `</g>`);
  L.push(`<g id="departements-liste" fill="#f3cbc6" stroke="none">` +
         cheminPlan(plan, f => sel.has(f.code), "") + `</g>`);
  L.push(`<g id="communes-choisies" fill="${COMMONS.rouge}" stroke="none" fill-rule="evenodd">`);
  R.choisies.forEach(c => {
    const p = partieDe(c);
    c.atomes.forEach(a => L.push(`<path${decale(p)} d="${cheminPx(a.v.g, p.P)}"/>`));
  });
  L.push(`</g>`);
  L.push(`<g id="limites-departementales" fill="none" stroke="#8f897f" stroke-width="0.7" ` +
         `stroke-linejoin="round">` + cheminPlan(plan, () => true, "") + `</g>`);
  L.push(reperesSVG(R, partieDe, 1.5, 2.2).svg.replace(`stroke-width="1"`, `stroke-width="0.6"`));
  if (o.nomsDeps) {
    const it = plan.parties.filter(p => sel.has(p.f.code)).map(p => {
      const q = poleInterieur(p.f.g, p.P);
      const d = R.dossiers.find(x => x.code === p.f.code);
      if (!q || !d) return null;
      // une case d'outre-mer est trop petite pour un nom posé dedans : à droite
      return p.f.dom ? { x: p.x + p.P.W + 4, y: p.y + p.P.H / 2, t: d.nomEpoque, taille: 12, ancre: "start" }
                     : { x: q[0], y: q[1], t: d.nomEpoque, taille: 12 };
    }).filter(Boolean);
    L.push(etiquettesSVG("noms-departements", it,
      { texte: `fill="#1d1c1a" font-style="italic"`, halo: 3 }));
  }
  L.push(`</svg>`);
  return L.join("\n");
}

// --- nom de fichier, description, catégories ------------------------------
function propositionListe(o) {
  const R = CL.res, Y = R.Y, n = R.choisies.length, deps = R.dossiers;
  const ens = $c("c-ensemble").value.trim() || "Communes sélectionnées";

  const ouFr = deps.length > 1
    ? `réparties entre ${deps.length} départements (${etListe(deps.map(d => d.nomEpoque))})`
    : `du département ${deDep(deps[0].nomEpoque)}`;

    : `in the ${deps[0].nomEpoque} department`;
  let fr = (france ? `Carte de situation en France : ` : `Carte de localisation des communes : `) +
    `${ens} (${nat.fr}), ${n} ${pl(n, "commune", "communes")} ${ouFr}. Limites communales de ${Y}.`;
  if (nouvelles.length)
    fr += ` ${pl(nouvelles.length, "La commune nouvelle", "Les communes nouvelles")} créée${pl(nouvelles.length, "", "s")} ` +
          `depuis 2012 (${etListe(nouvelles.map(c => c.nom))}) ${pl(nouvelles.length, "est dessinée", "sont dessinées")} ` +
          `par les communes qu'elle${pl(nouvelles.length, "", "s")} réuni${pl(nouvelles.length, "t", "ssent")}.`;
  fr += "\n" + parDep.map(({ d, cs }) => `* ${d.nomEpoque} (${cs.length}) : ${cs.map(c => c.nom).join(", ")}`).join("\n");
  const en = (france ? `Locator map within France: ` : `Locator map of the municipalities: `) +
    `${ens} (${nat.en}), ${n} ${pl(n, "municipality", "municipalities")} ${ouEn}, France. ` +
    `Municipal boundaries as of ${Y}.`;
  const repli = R.choisies.reduce((s, c) => s + (c.atomes.some(a => a.v.r) ? 1 : 0), 0);
  const src = $c("c-source-liste").value.trim();
  const sources = [`Liste des communes : ${src || "''à préciser''"}`,
    `Codes et noms : Insee, Code officiel géographique 2012 et mouvements des communes ` +
    `jusqu'en ${CL.millesime || 2025} (Licence Ouverte)`];
  if (france || o.medaillon) sources.push("Départements : contours de la base ''histgis'', simplifiés");
  const cats = [...nat.categories];
  deps.forEach(d => COMMONS.categoriesListe.parDep.forEach(c => cats.push(c.replace("{dep}", d.moderne))));
  if (!recent) {
    deps.forEach(d => cats.push(`Maps of the history of ${d.moderne}`));
    cats.push("{periode}");
  }
  return assemble({ moderne: "", nomEpoque: "", per: recent ? null : periodeDe(Y) }, {
    nom: fichier(france ? "france" : "communes"),
    titre: `${ens}${sfx}` + (france ? ", situation en France" : ""),
    fr, en,
    source: sources.join("\n* "),
    fond: "ANR-COMMUNES, trame communale historique datée (Zenodo)" +
          (repli ? ` ; IGN, GEOFLA 2011 (Licence Ouverte) pour ${repli} commune${pl(repli, "", "s")}` : ""),
    autre: `[[:File:${nomFichierPropre(fichier(france ? "communes" : "france"))}]]`,
    categories: cats,
  });
}

function noteListe() {
  const R = CL.res, n = R.choisies.length;
  const sc = R.dossiers.filter(d => d.sansCompo);
  return `${n} commune${n > 1 ? "s" : ""}, ${R.dossiers.length} département${R.dossiers.length > 1 ? "s" : ""}, ` +
    `limites communales de ${R.Y}` +
    (sc.length ? ` — pas de composition en ${R.Y} pour ${sc.map(d => d.nomEpoque).join(", ")} : ` +
                 `communes retenues sur leur seul code INSEE` : "") +
    ($c("c-source-liste").value.trim() ? "" : " — penser à citer la source de la liste") +
    (R.Y < 1870 ? " — médaillon : la France de 1870, la base n'a pas de contour plus ancien" : "");
}

// --- paragraphe pour Wikipédia ---------------------------------------------
function wikiListe() {
  const R = CL.res;
  if (!R || !R.choisies.length) return "";
  const ens = $c("c-ensemble").value.trim() || "Cet ensemble";
  const n = R.choisies.length;
  const lien = c => lienCommune({ nom: c.nom, dep: depDuCode(c.e.code), actuel: null, partie: false });
  const lienD = d => lienWP([`${d.nomEpoque} (département)`, d.nomEpoque], d.nomEpoque, /département|^[^(]+$/);
  const parDep = R.dossiers.map(d => ({ d, cs: R.choisies.filter(c => c.dossier === d.code) }));
  const t = `${maj(ens)} regroupe ${lettres(n, true)} commune${n > 1 ? "s" : ""}`;
  if (parDep.length === 1) {
    const { d, cs } = parDep[0];
    return `${t} du département ${deDep(d.nomEpoque).replace(d.nomEpoque, lienD(d))} : ` +
           `${etListe(cs.map(lien))}.`;
  }
  return `${t}, réparties entre ${lettres(parDep.length)} départements :\n\n` +
    parDep.map(({ d, cs }) => `* ${lienD(d)} (${cs.length}) : ${etListe(cs.map(lien))}`).join("\n");
}

// ===========================================================================
// Dialogue
// ===========================================================================
const CX = { etat: null, svg: null, url: null, plage: null, plages: {}, minuterie: null,
             categoriesEnPlus: [], cog: null, cogAbsent: false,
             wp: new Map(), wpDemandes: new Set(), wpRouges: new Map(), wpBleus: 0,
             nomsDevines: new Set(), devines: new Set(), minuterieWP: null };
const $c = id => document.getElementById(id);
const CHAMPS = ["c-nom", "c-texte", "c-cats", "c-wiki"];
const oublieRetouches = () => CHAMPS.forEach(i => delete $c(i).dataset.touche);

function optionsCommons() {
  return {
    niveau: document.querySelector("input[name=c-niveau]:checked").value,
    type: document.querySelector("input[name=c-type]:checked").value,
    unite: $c("c-circo").value,
    communes: $c("c-communes").checked,
    autre: $c("c-cantons").checked,
    numeros: $c("c-numeros").checked,
    // liste de communes
    typeListe: document.querySelector("input[name=c-type-liste]:checked").value,
    communesListe: $c("c-l-communes").checked,
    nomsCommunes: $c("c-l-noms").checked,
    nomsDeps: $c("c-l-deps").checked,
    medaillon: $c("c-l-medaillon").checked,
  };
}

// La liste des unités et les libellés suivent le niveau choisi.
function remplitUnites() {
  const canton = optionsCommons().niveau === "canton";
  const sel = $c("c-circo"), garde = sel.value;
  sel.innerHTML = "";
  unitesDe(canton ? "canton" : "circo").forEach(u => {
    const o = document.createElement("option");
    o.value = u.id; o.textContent = canton ? maj(nomCanton(u)) : nomCommons(u);
    sel.appendChild(o);
  });
  if ([...sel.options].some(o => o.value === garde)) sel.value = garde;
  $c("c-type-situ").textContent = canton ? "d'un canton" : "d'une circonscription";
  $c("c-cantons-lib").textContent = canton ? "limites des circonscriptions" : "limites cantonales";
  $c("c-numeros-lib").textContent = canton ? "noms" : "numéros";
  $c("c-cantons").disabled = canton ? !unitesDe("circo").length : !S.cfgCanton;
}

// Les deux cartes n'ont pas les mêmes réglages par défaut : la carte de
// situation se lit d'un coup d'œil, sans communes ni autre couche — et, pour
// un canton, sans les quarante noms de ses voisins.
function reglagesParDefaut() {
  const o = optionsCommons(), situ = o.type === "situation";
  $c("c-communes").checked = !situ;
  $c("c-cantons").checked = !situ && !$c("c-cantons").disabled;
  $c("c-numeros").checked = !(situ && o.niveau === "canton");
}

async function chargeCog() {
  if (CX.cog) return;
  try { CX.cog = await charge(`${RACINE}/noms_cog.json`); }
  catch (e) { CX.cog = {}; CX.cogAbsent = true; }
}

async function plageDe(niveau) {
  if (!CX.plages[niveau])
    CX.plages[niveau] = await (niveau === "canton" ? plageCantons() : plageDecoupage());
  return CX.plages[niveau];
}

// Même question que `plageDecoupage()`, pour les cantons : les identifiants
// d'unités cantonales ne portent pas d'année (`2101` en 1876 comme en 1982),
// on compare donc la composition elle-même — atome par atome, le NOM du canton
// qui le tient. Une commune qui change de canton coupe la plage ; une forme
// redessinée, non. La base ne tenant pas de cantons avant 1870 (et de façon
// inégale entre 1941 et 1998), une plage qui bute sur une année sans couche
// cantonale est dite ouverte : le découpage peut valoir au-delà.
async function plageCantons() {
  const an = S.depIndex.annees, memo = new Map();
  const [b0, b1] = bornes();
  const sig = async a => {
    const e = an[String(a)];
    if (!e || !e.c) return null;
    if (!memo.has(e.c)) {
      const c = await charge(`${RACINE}/dep/${S.dep}/c_${e.c}.json`);
      const nom = new Map(c.unites.map(u => [u.id, u.nom]));
      memo.set(e.c, Object.entries(c.rattachement).map(([x, k]) => x + ">" + nom.get(k)).sort().join("|"));
    }
    return memo.get(e.c);
  };
  const ref = await sig(S.annee);
  let a0 = S.annee, a1 = S.annee;
  while (a0 - 1 >= b0 && await sig(a0 - 1) === ref) a0--;
  while (a1 + 1 <= b1 && await sig(a1 + 1) === ref) a1++;
  return { a0, a1,
           ouvertDebut: a0 === b0 || (await sig(a0 - 1)) === null,
           ouvertFin: a1 === b1 || (await sig(a1 + 1)) === null };
}

async function ouvreCommons() {
  const dlg = $c("commons");
  $c("c-resultat").innerHTML = "";
  const peutX = unitesDe("circo").length > 0, peutC = unitesDe("canton").length > 0;
  // Sans circonscription ni canton à cette date, il reste la liste de
  // communes, qui ne dépend pas du département affiché.
  $c("c-corps").hidden = false; $c("c-vide").hidden = true;
  const rx = document.querySelector("input[name=c-niveau][value=circo]");
  const rc = document.querySelector("input[name=c-niveau][value=canton]");
  const rl = document.querySelector("input[name=c-niveau][value=liste]");
  rx.disabled = !peutX; rc.disabled = !peutC;
  const niv0 = optionsCommons().niveau;
  if ((niv0 === "circo" && !peutX) || (niv0 === "canton" && !peutC))
    (peutX ? rx : peutC ? rc : rl).checked = true;
  if (!$c("c-annee-liste").value) $c("c-annee-liste").value = (S.index && S.index.an_max) || AN_MAX;
  // Une nouvelle année ou un nouveau département : les champs retouchés à la
  // main pour une autre carte n'ont plus de sens, ni la période calculée.
  const cle = S.dep + "/" + S.annee;
  const neuf = CX.cle !== cle;
  if (neuf) { oublieRetouches(); CX.plages = {}; }
  CX.cle = cle;
  remplitUnites();
  if (neuf) reglagesParDefaut();
  dlg.showModal();
  // L'état du compte d'abord : il apporte les catégories de `commons.toml`,
  // qui doivent figurer dans la première proposition.
  const niv = optionsCommons().niveau;
  await Promise.all([niv === "liste" ? prepareListe() : plageDe(niv), etatCommons(), chargeCog()]);
  regenere();
}

function regenere(force = false) {
  const o = optionsCommons();
  const liste = o.niveau === "liste";
  $c("c-bloc-unites").hidden = liste;
  $c("c-bloc-liste").hidden = !liste;
  $c("c-w-communes").disabled = liste;      // une liste se liste toujours
  $c("c-circo").disabled = o.type !== "situation";
  let p, note;
  if (liste) {
    if (!CL.res || !CL.res.choisies.length) return videListe();
    p = propositionListe(o);
    o.titre = p.titre; o.desc = p.desc;
    o.communes = o.communesListe;
    CX.svg = fabriqueSVGListe(o);
    note = noteListe();
  } else {
    CX.plage = CX.plages[o.niveau];
    if (!CX.plage) return;            // la plage arrive : on sera rappelé
    p = proposition(o, CX.plage);
    o.titre = p.titre; o.desc = p.desc;
    CX.svg = fabriqueSVG(o);
    note = `découpage ${o.niveau === "canton" ? "cantonal " : ""}en vigueur ${CX.plage.a0 === CX.plage.a1 ? "en " + CX.plage.a0
      : "de " + CX.plage.a0 + " à " + CX.plage.a1}` +
      (CX.plage.ouvertDebut || CX.plage.ouvertFin
        ? " (borne de la base : le découpage peut valoir au-delà)" : "");
  }
  if (CX.url) URL.revokeObjectURL(CX.url);
  CX.url = URL.createObjectURL(new Blob([CX.svg], { type: "image/svg+xml" }));
  $c("c-img").src = CX.url;
  $c("c-poids").textContent = `${(CX.svg.length / 1024).toFixed(0)} Ko — ` + note;
  const pose = (id, v) => { if (force || !$c(id).dataset.touche) $c(id).value = v; };
  pose("c-nom", p.nom);
  pose("c-texte", p.texte);
  pose("c-cats", p.categories.join("\n"));
  majWiki(force);
  if (force) oublieRetouches();
  const a = $c("c-telecharger");
  a.href = CX.url; a.download = $c("c-nom").value || "carte.svg";
  verifieBientot(0);
  verifieLiensBientot();
}

// Une liste vide ou dont rien n'est trouvé : pas d'image, rien à déposer.
function videListe() {
  CX.svg = null;
  if (CX.url) { URL.revokeObjectURL(CX.url); CX.url = null; }
  $c("c-img").removeAttribute("src");
  $c("c-telecharger").removeAttribute("href");
  $c("c-poids").textContent = $c("c-liste").value.trim()
    ? "aucune commune de la liste n'a pu être dessinée — voir sous la liste"
    : "saisir une liste de communes";
  if (!$c("c-wiki").dataset.touche) $c("c-wiki").value = "";
  $c("c-wiki-etat").innerHTML = "";
}

function categoriesSaisies() {
  return [...new Set($c("c-cats").value.split("\n")
    .map(s => s.replace(/^\s*\[\[\s*Category:|^\s*Category:|\]\]\s*$/gi, "").trim())
    .filter(Boolean))];
}
function texteFinal() {
  return $c("c-texte").value.trimEnd() + "\n\n" +
    categoriesSaisies().map(c => `[[Category:${c}]]`).join("\n") + "\n";
}

async function appelCommons(route, corps) {
  const r = await fetch(route, corps === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(corps),
  });
  if (r.status === 404 || r.status === 501)
    throw new Error("ce serveur ne connaît pas les routes Commons — lancer cartes/web/servir.py");
  const j = await r.json().catch(() => ({ erreur: `réponse illisible (${r.status})` }));
  if (!r.ok) throw new Error(j.erreur || `HTTP ${r.status}`);
  return j;
}

async function etatCommons() {
  const e = $c("c-compte"), b = $c("c-deposer");
  e.textContent = "connexion à Commons…";
  try {
    CX.etat = await appelCommons("commons/etat");
    CX.categoriesEnPlus = CX.etat.categories || [];
    if (CX.etat.utilisateur) {
      e.innerHTML = `Dépôt sous le compte <b>${echappe(CX.etat.utilisateur)}</b>` +
        (CX.etat.api.includes("commons.wikimedia.org") ? "" :
         ` — <b>API de test</b> : ${echappe(CX.etat.api)}`) +
        (CX.etat.peut_deposer === false ? ` — <b>ce compte n'a pas le droit de téléverser</b>` : "");
      b.disabled = CX.etat.peut_deposer === false;
    } else {
      e.textContent = CX.etat.message || "non connecté";
      b.disabled = true;
    }
  } catch (err) {
    CX.etat = null;
    e.textContent = err.message;
    b.disabled = true;
  }
}

function verifieBientot(delai = 700) {
  clearTimeout(CX.minuterie);
  CX.minuterie = setTimeout(verifie, delai);
}

async function verifie() {
  const nom = $c("c-nom").value.trim(), cats = categoriesSaisies();
  $c("c-telecharger").download = nom || "carte.svg";
  const zn = $c("c-nom-etat"), zc = $c("c-cats-etat");
  try {
    const r = await appelCommons("commons/verifier", { fichier: nom, categories: cats });
    if (nom !== $c("c-nom").value.trim()) return;      // dépassé par la frappe
    const f = r.fichier || {};
    zn.innerHTML = f.invalide ? `<span class="c-ko">nom refusé par Commons</span>`
      : f.existe ? `<span class="c-ko">existe déjà :</span> <a href="${echappe(f.url)}"
          target="_blank" rel="noopener">voir le fichier</a> — choisir un autre nom,
          sauf à vouloir le remplacer`
      : `<span class="c-ok">nom libre</span>`;
    zc.innerHTML = cats.map(c => {
      const i = r.categories[c] || {};
      const lien = `<a href="https://commons.wikimedia.org/wiki/Category:${
        encodeURIComponent(c.replace(/ /g, "_"))}" target="_blank" rel="noopener">${echappe(c)}</a>`;
      if (i.existe && !i.redirection) return `<div><span class="c-ok">✓</span> ${lien}</div>`;
      if (i.existe) return `<div><span class="c-ko">↪</span> ${lien} — catégorie
        <b>redirigée</b> : la remplacer par sa cible</div>`;
      const sug = (i.suggestions || []).map(s =>
        `<button type="button" class="c-sug" data-de="${echappe(c)}" data-vers="${echappe(s)}">${echappe(s)}</button>`).join(" ");
      return `<div><span class="c-ko">✗</span> ${echappe(c)} — <b>n'existe pas</b>` +
             (sug ? `<br><span class="note">remplacer par :</span> ${sug}` : "") + `</div>`;
    }).join("");
    zc.querySelectorAll(".c-sug").forEach(b => b.onclick = () => {
      $c("c-cats").value = categoriesSaisies()
        .map(c => c === b.dataset.de ? b.dataset.vers : c).join("\n");
      $c("c-cats").dataset.touche = "1";
      verifieBientot(0);
    });
  } catch (err) {
    zn.textContent = ""; zc.innerHTML = `<span class="note">vérification impossible : ${echappe(err.message)}</span>`;
  }
}

async function depose(ignorer = false) {
  const b = $c("c-deposer"), z = $c("c-resultat");
  const nom = $c("c-nom").value.trim().replace(/(\.svg)*$/i, ".svg");
  if (!CX.svg) { z.innerHTML = `<p class="avert">rien à déposer : pas d'image</p>`; return; }
  b.disabled = true; z.innerHTML = `<p class="note">envoi de ${echappe(nom)}…</p>`;
  let d;
  try {
    d = await appelCommons("commons/envoi",
      { nom, svg: CX.svg, texte: texteFinal(), ignorer });
  } catch (err) {
    z.innerHTML = `<p class="avert">${echappe(err.message)}</p>`;
    b.disabled = false;
    return;
  }
  const up = d.upload || {};
  if (up.result === "Success") {
    const url = (up.imageinfo && up.imageinfo.descriptionurl) ||
      "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(nom.replace(/ /g, "_"));
    z.innerHTML = `<p class="c-succes">Déposé : <a href="${echappe(url)}" target="_blank"
      rel="noopener">${echappe(up.filename || nom)}</a></p>`;
    b.disabled = false;
    verifieBientot(0);
    return;
  }
  if (d.error) {
    const auth = /mwoauth|invalid.?auth|badaccess|notloggedin/i.test(d.error.code || "");
    z.innerHTML = `<p class="avert"><b>${echappe(d.error.code)}</b> : ${echappe(d.error.info || "")}` +
      (auth ? `<br>Le jeton est refusé ou périmé : en créer un nouveau et le mettre dans
               <code>cartes/web/commons.toml</code>.` : "") + `</p>`;
    b.disabled = false;
    return;
  }
  if (up.result === "Warning") {
    const av = up.warnings || {};
    const lignes = Object.entries(av).map(([k, v]) => {
      if (k === "exists" || k === "exists-normalized" || k === "page-exists")
        return `un fichier <b>de ce nom</b> existe déjà sur Commons`;
      if (k === "duplicate")
        return `<b>doublon</b> exact de : ${[].concat(v).map(f =>
          `<a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(f)}" target="_blank" rel="noopener">${echappe(f)}</a>`).join(", ")}`;
      if (k === "was-deleted") return `un fichier de ce nom a été <b>supprimé</b> : changer de nom`;
      if (k === "badfilename") return `nom refusé, Commons propose : ${echappe(v)}`;
      return `${echappe(k)} : ${echappe(JSON.stringify(v))}`;
    });
    z.innerHTML = `<div class="avert"><b>Commons avertit :</b><br>${lignes.join("<br>")}</div>`;
    if (d.histgis && d.histgis.peut_forcer) {
      const f = document.createElement("button");
      f.type = "button";
      f.textContent = "déposer quand même";
      f.title = "Écrase ou duplique en connaissance de cause — Commons peut le refuser selon les droits du compte";
      f.onclick = () => depose(true);
      z.appendChild(f);
    }
    b.disabled = false;
    return;
  }
  z.innerHTML = `<p class="avert">Réponse inattendue : <code>${echappe(JSON.stringify(d))}</code></p>`;
  b.disabled = false;
}

// --- branchements ----------------------------------------------------------
$c("ouvre-commons").addEventListener("click", ouvreCommons);
document.querySelectorAll("input[name=c-niveau]").forEach(r =>
  r.addEventListener("change", async () => {
    remplitUnites();
    reglagesParDefaut();
    oublieRetouches();
    const niv = optionsCommons().niveau;
    if (niv === "liste") await prepareListe(); else await plageDe(niv);
    regenere();
  }));
// Liste de communes : la saisie, le filtre et l'année relancent la résolution
// (et le chargement des départements) ; le nom de l'ensemble, sa nature et
// sa source ne touchent qu'aux textes.
["c-liste", "c-filtre", "c-annee-liste"].forEach(id =>
  $c(id).addEventListener("input", () => relisteBientot()));
["c-ensemble", "c-source-liste"].forEach(id => $c(id).addEventListener("input", () => {
  clearTimeout(CL.minTexte);
  CL.minTexte = setTimeout(() => regenere(), 400);
}));
$c("c-nature").addEventListener("change", () => regenere());
document.querySelectorAll("input[name=c-type-liste]").forEach(r =>
  r.addEventListener("change", () => { oublieRetouches(); regenere(); }));
["c-l-communes", "c-l-noms", "c-l-deps", "c-l-medaillon"].forEach(id =>
  $c(id).addEventListener("change", () => { $c(id).dataset.touche = "1"; regenere(); }));
document.querySelectorAll("input[name=c-type]").forEach(r =>
  r.addEventListener("change", () => {
    reglagesParDefaut();
    oublieRetouches();
    regenere();
  }));
// Changer d'unité change de fichier : les retouches faites pour la précédente
// n'ont plus d'objet. Les cases à cocher, elles, ne touchent qu'à l'image.
$c("c-circo").addEventListener("change", () => {
  oublieRetouches();
  regenere();
});
["c-communes", "c-cantons", "c-numeros"].forEach(id =>
  $c(id).addEventListener("change", () => regenere()));
CHAMPS.forEach(id => $c(id).addEventListener("input", () => {
  $c(id).dataset.touche = "1";
  if (id === "c-nom" || id === "c-cats") verifieBientot();
}));
["c-w-communes", "c-w-rouges"].forEach(id => $c(id).addEventListener("change", () => {
  delete $c("c-wiki").dataset.touche;
  majWiki();
  verifieLiensBientot(0);
}));
$c("c-w-copier").addEventListener("click", async () => {
  const b = $c("c-w-copier"), t = $c("c-wiki");
  try { await navigator.clipboard.writeText(t.value); }
  catch (e) { t.select(); document.execCommand("copy"); }
  b.textContent = "copié ✓";
  setTimeout(() => { b.textContent = "copier"; }, 1500);
});
$c("c-reinit").addEventListener("click", () => regenere(true));
$c("c-verifier").addEventListener("click", () => { verifieBientot(0); verifieLiensBientot(0); });
$c("c-deposer").addEventListener("click", () => depose(false));
$c("commons").addEventListener("keydown", ev => ev.stopPropagation());
</script>
